id: auth
order: 4
domain: cryptoauth
color: "#7A3A8C"
name: 認証技術・ID管理・アクセス制御
short: 認証とアクセス制御
shortLines: [認証と, アクセス制御]
priority: high
badges: []
summary: 「あなたは誰か（認証）」と「何をしてよいか（認可）」を決める分野。ID連携やパスキーなど、クラウド時代のログインの仕組みもここに含まれる。
themes:
  - 認証と認可の区別
  - 多要素認証とフィッシング耐性（FIDO2／WebAuthn、パスキー）
  - OAuth 2.0・OpenID Connect・SAMLの役割の違い
  - アクセス制御モデル（DAC／MAC／RBAC／ABAC）
  - 特権IDの管理とアカウントのライフサイクル
keywords: [多要素認証, FIDO2, WebAuthn, パスキー, OAuth 2.0, OpenID Connect, SAML, JWT, RBAC, 特権アクセス管理]
examA2: 認証方式の特徴、生体認証の指標（FAR／FRR）、アクセス制御モデルの区別などを問う。
examB: R5秋 問3でWebAuthn、R6春 問1でJWTの検証、R6春 問2で多要素認証を突破する攻撃、R7秋 問3でリモートワーク環境の認証基盤が題材になった。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類11 セキュリティ（◎4）}
  - {doc: シラバス Ver.2.1, where: 科目B 3-8 アカウント管理及びアクセス管理}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類25「4 技術的管理策（情報アクセスの管理）」}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4）。直近の科目Bでは、R5秋 問3（WebAuthn）、R6春 問1（JWTの改ざんの検証）、R6春 問2（多要素認証の突破）、R7秋 問3（認証基盤とハードウェアトークン）が認証を題材にしている。新制度のシラバス案では、フィッシング耐性のある認証、PKCE、パスキーなどが用語例に明記された。
textbook: ["6.1", "6.2", "6.4", "6.5", "6.8", "6.9"]
subs:
  - id: methods
    name: 本人認証の方式
    terms:
      - [認証と認可, 認証は本人であることの確認、認可はその人に何を許すかの決定。OAuthは認可、OpenID Connectは認証の仕組み。, {aka: [認可]}]
      - [ワンタイムパスワード, 一度しか使えないパスワード。トークンやアプリで生成し、盗聴されても再利用できない。]
      - [チャレンジレスポンス認証, サーバが送る乱数（チャレンジ）と秘密の情報から計算した値を返し、パスワード自体は送らない方式。, {aka: [チャレンジレスポンス]}]
      - [生体認証（FAR／FRR）, 指紋や顔などで本人を確かめる方式。他人を受け入れる率（FAR）と本人を拒否する率（FRR）は片方を下げるともう片方が上がる。, {aka: [他人受入率, 本人拒否率]}]
      - [Kerberos, 認証サーバが発行するチケットを使い、何度もパスワードを送らずに複数のサービスを使う認証方式。]
  - id: mfa
    name: 多要素・パスワードレス
    terms:
      - [多要素認証, 知識（パスワード）・所持（スマホなど）・生体（指紋など）のうち、異なる2つ以上を組み合わせる認証。]
      - [多段階認証, 認証を複数回に分けて行う方式。同じ種類の要素を2回使う場合は多要素認証にならない。]
      - [リスクベース認証, いつもと違う場所や端末からのログインのときだけ、追加の確認を求める方式。]
      - [FIDO2／WebAuthn, 端末内の秘密鍵で署名して認証する標準。パスワードを送らず、偽サイトでは使えないためフィッシングに強い。, {aka: [FIDO2, WebAuthn]}]
      - [パスキー, FIDOの鍵を複数の端末で同期できるようにした、パスワード不要のログイン方式。, {new: true}]
  - id: federation
    name: SSOとID連携
    terms:
      - [シングルサインオン（SSO）, 一度のログインで複数のサービスを使えるようにする仕組み。, {aka: [シングルサインオン]}]
      - [SAML, XMLで認証結果（アサーション）をやり取りし、主に企業向けのSSOを実現する規格。]
      - [OAuth 2.0, パスワードを渡さずに、サービスへのアクセス権（アクセストークン）だけを委ねる認可の仕組み。, {aka: [OAuth]}]
      - [OpenID Connect, OAuth 2.0の上に、本人確認の結果（IDトークン）を返す仕組みを加えた認証の規格。]
      - [JWT, 署名を付けてやり取りできるJSON形式のトークン。受け取った側が署名を正しく検証しないと改ざんされる。, {new: true}]
      - [PKCE, 認可コードを横取りされても使えないようにする、OAuth 2.0の拡張。, {new: true}]
      - [IDaaS, ID管理や認証、SSOをクラウドで提供するサービス。]
  - id: acmodel
    name: アクセス制御モデル
    terms:
      - [任意アクセス制御（DAC）, ファイルの所有者が、誰にどの権限を与えるかを自由に決める方式。, {aka: [任意アクセス制御], new: true}]
      - [強制アクセス制御（MAC）, システムが決めた機密度のラベルに従って制御し、所有者でも変えられない方式。, {aka: [強制アクセス制御]}]
      - [ロールベースアクセス制御（RBAC）, 「経理担当」などの役割に権限を付け、人には役割を割り当てる方式。, {aka: [ロールベースアクセス制御, RBAC]}]
      - [属性ベースアクセス制御（ABAC）, 利用者・資源・時間帯などの属性を組み合わせたルールで許可を決める方式。, {aka: [属性ベースアクセス制御, ABAC], new: true}]
  - id: privileged
    name: 特権・アカウント管理
    terms:
      - [特権アクセス管理（PAM）, 管理者権限の貸出し・利用の記録・パスワードの管理を一元的に行う仕組み。, {aka: [特権アクセス管理, PAM], new: true}]
      - [アクセス権のレビュー, 異動・退職などに合わせて、不要なアカウントや過剰な権限を定期的に見直すこと。, {aka: [アカウント及びアクセス権のレビュー]}]
      - [LDAP, 利用者の情報を階層的に管理するディレクトリサービスにアクセスするためのプロトコル。]
