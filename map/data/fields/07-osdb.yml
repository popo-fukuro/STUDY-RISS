id: osdb
order: 7
domain: infra
color: "#235F80"
name: OS・サーバ・データベース・端末のセキュリティ
short: OS・DB・端末
shortLines: [OS・DB・, 端末]
priority: mid
badges: []
summary: Webアプリやサービスを動かす「土台」の守り方。OSやサーバの設定を固め、データベースを守り、社員のPCやスマホを管理する。
themes:
  - 要塞化（不要なサービスの停止、最小権限）
  - Linuxのファイル権限と管理者権限
  - データベースのアクセス制御と暗号化
  - EDR・MDMによる端末の管理
  - TPM・セキュアブートなどハードウェアによる守り
keywords: [要塞化, パーミッション, セキュアOS, パッチ管理, データベース暗号化, ストアドプロシージャ, MDM, EDR, TPM, セキュアブート]
examA2: データベース（○3）の正規化・トランザクションや、OSのアクセス制御、TPMなどを問う。
examB: R6春 問4でLinuxの権限設定、R6秋 問1でエンドポイントのログとマルウェア対策が題材になった。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類9 データベース（○3）}
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「5. セキュリティ実装技術」の(3)OSのセキュリティ・(5)データベースセキュリティ}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類17 データベース、中分類26「ハードウェアのセキュリティ」}
priorityReason: 試験要綱では科目A-2のデータベースは○3で、重点分野ではない。直近の科目Bでは、R6春 問4（Linuxの権限設定）とR6秋 問1（エンドポイントのログ）が題材にしているが、どちらもWebアプリやインシデント対応の問の一部として出ている。新制度でもデータベースは科目A-2の○（重点ではない）のまま。
textbook: ["4.5", "5.2", "5.4", "5.9"]
subs:
  - id: harden
    name: OSとサーバの要塞化
    terms:
      - [要塞化（ハードニング）, 不要なサービスやアカウントを止め、設定を固めて攻撃の入口を減らすこと。, {aka: [要塞化, ハードニング]}]
      - [パーミッション, ファイルごとに、所有者・グループ・その他の人が読める・書ける・実行できるかを決める設定。, {sup: true, checked: true}]
      - [rootとsudo, 何でもできる管理者アカウントと、必要なときだけ一時的に管理者として命令を実行する仕組み。, {sup: true, checked: true}]
      - [セキュアOS, 強制アクセス制御などで、管理者でも勝手な操作をできないようにしたOS。Trusted OSとも呼ぶ。, {aka: [セキュアOS, Trusted OS]}]
      - [パッチ管理, OSやソフトの修正プログラムを、計画的に確認・適用すること。, {new: true}]
  - id: db
    name: データベースの安全
    terms:
      - [データベース暗号化, 保存したデータを暗号化し、媒体の盗難やファイルの持出しから守る対策。]
      - [GRANT／REVOKE, 表ごとに、誰が参照・更新できるかの権限を与えたり取り消したりするSQLの命令。, {aka: [GRANT]}]
      - [ビュー, 表の一部だけを見せる仮想的な表。見せたくない列を隠すのに使える。]
      - [排他制御, 複数の処理が同時に同じデータを更新しても、矛盾が起きないようにする仕組み。]
      - [ストアドプロシージャ, データベースの中に保存しておく一連の処理。アプリ側でSQLを組み立てずに済む。]
  - id: endpoint
    name: 端末・モバイル管理
    terms:
      - [MDM, 会社が配るスマホやタブレットを一元管理し、紛失時には遠隔でロックやデータ消去を行う仕組み。]
      - [リモートワイプ, 紛失した端末のデータを、遠隔操作で消去すること。, {aka: [遠隔でのデータ消去]}]
      - [BYOD, 私物の端末を業務に使うこと。会社の管理が届きにくく、情報漏えいのおそれがある。]
      - [シャドーIT, 会社が把握・許可していないクラウドサービスや機器を、従業員が業務で使うこと。]
  - id: antimal
    name: マルウェア対策製品
    terms:
      - [マルウェア対策ソフト, 既知のマルウェアの特徴をまとめた定義ファイルと照合して、検知・駆除するソフト。]
      - [ビヘイビア法（振る舞い検知）, プログラムの動きを観察し、怪しい挙動から未知のマルウェアを見つける方式。, {aka: [ビヘイビア法, 振る舞い検知]}]
      - [EDR, 端末の操作や通信を記録・監視し、侵入された後の検知・調査・隔離を助ける製品。]
      - [サンドボックス, 隔離された環境で怪しいファイルを実際に動かし、挙動を観察する仕組み。]
  - id: hw
    name: ハードウェアの安全
    terms:
      - [TPM, PCに内蔵され、鍵の保管や、起動時の状態の測定を行うセキュリティチップ。]
      - [セキュアブート, 起動するときに、署名を確かめた正規のプログラムだけを読み込む仕組み。]
      - [耐タンパ性, 装置をこじ開けたり解析したりしても、中の秘密情報を取り出しにくい性質。]
      - [自己暗号化ドライブ（SED）, 書き込むデータを自動で暗号化する記憶装置。, {aka: [自己暗号化ドライブ]}]
