id: devproc
order: 10
domain: dev
color: "#3A6B2C"
name: システム開発・開発プロセスのセキュリティ
short: セキュア開発工程
shortLines: [セキュア, 開発工程]
priority: mid
badges: []
summary: 作る前・作る途中・作った後のそれぞれの工程で、セキュリティを組み込む進め方。開発の委託や外部のライブラリなど、ソフトウェアの「供給網」の管理も含む。
themes:
  - 要件定義でのセキュリティ要件と設計レビュー
  - SAST・DAST・IAST・ファジングの使い分け
  - 開発環境・リポジトリ・シークレットの管理
  - SBOMとOSS（外部の部品）の管理
  - アジャイル開発とDevSecOps
keywords: [セキュリティ要件, SAST, DAST, IAST, ファジング, SBOM, SCA, 構成管理, シークレット管理, アジャイル開発]
examA2: システム開発技術（○3）・ソフトウェア開発管理技術（○3）として、テストの手法、開発プロセス、構成管理などを問う。
examB: R7春 問1でSBOMやSAST・DAST・IAST、R7秋 問1の設問4で脆弱性を見つけて直すための開発プロセスが問われた。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類12 システム開発技術（○3）・中分類13 ソフトウェア開発管理技術（○3）}
  - {doc: シラバス Ver.2.1, where: 科目B 2-1 企画・要件定義、2-6 セキュリティテスト、2-8 開発環境のセキュリティ確保}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類20 システムライフサイクルプロセス、中分類21 開発・運用の方法論}
priorityReason: 試験要綱では科目A-2のシステム開発技術・ソフトウェア開発管理技術はいずれも○3で、重点分野ではない。直近の科目Bでは、R7春 問1（サプライチェーンリスク対策、SBOM、SAST・DAST・IAST）とR7秋 問1（開発プロセスでの対策）が題材にしている。新制度の科目A-2でも○（重点ではない）。
textbook: ["8.1"]
subs:
  - id: req
    name: 要件・設計の安全
    terms:
      - [セキュリティ要件, システムが満たすべきセキュリティ上の条件。認証・ログ・暗号化などを、脅威分析の結果から決める。]
      - [プライバシー・バイ・デザイン, 設計の段階から、個人情報の保護を組み込む考え方。, {aka: [プライバシーバイデザイン]}]
      - [非機能要件, 性能・可用性・セキュリティなど、機能以外にシステムに求める条件。]
      - [仕様書のレビュー, 仕様書や設計書をセキュリティの観点で点検し、脆弱性の作り込みを早い段階で防ぐこと。, {aka: [仕様書をレビュー]}]
  - id: test
    name: セキュリティテスト
    terms:
      - [SAST, プログラムを動かさずに、ソースコードを解析して脆弱性を探すテスト（静的検査）。]
      - [DAST, 動いているアプリに外から攻撃を模した入力を送り、脆弱性を探すテスト（動的検査）。]
      - [IAST, アプリの内部に検査の仕組みを組み込み、動かしながら脆弱性を見つけるテスト。]
      - [ファジング, 想定外のデータを大量に入力し、異常な動作を引き起こす不具合を探すテスト。]
      - [回帰テスト, 修正によって、それまで動いていた機能が壊れていないかを確かめるテスト。]
  - id: env
    name: 開発環境と構成管理
    terms:
      - [構成管理, ソースコード・設定・文書の版を記録し、どの組合せが正しいかを管理すること。]
      - [バージョン管理, ソースコードの変更履歴を残し、誰がいつ何を変えたかを追えるようにすること。]
      - [シークレット管理, パスワードやAPIキーをコードに書かず、専用の保管庫で管理すること。, {new: true}]
      - [署名付きコミット, コードの変更に署名を付け、誰が変更したかを確かめられるようにすること。, {new: true}]
  - id: supply
    name: ソフトウェア供給網
    terms:
      - [SBOM, ソフトウェアに含まれる部品とその版の一覧。脆弱性が公表されたとき、影響を受けるかをすぐ調べられる。]
      - [SCA（ソフトウェア構成分析）, 使っているOSSなどの部品を洗い出し、既知の脆弱性やライセンスを確かめる手法。, {aka: [ソフトウェア構成分析, SCA]}]
      - [依存関係混同, 社内用の部品と同じ名前の悪意ある部品を公開の保管場所に置き、取り込ませる攻撃。, {aka: [依存関係混同, Dependency Confusion], new: true}]
      - [SLSA, ソフトウェアのビルドの過程が改ざんされていないことを保証するための枠組み。, {new: true}]
      - [委託先の成果物の確認, 開発を外部に委託したとき、契約どおりのセキュリティが守られているかを確かめること。, {aka: [委託先からの成果物の確認]}]
  - id: process
    name: 開発プロセス・手法
    terms:
      - [アジャイル開発, 短い期間で計画・開発・確認を繰り返し、少しずつ作っていく開発手法。]
      - [ウォーターフォールモデル, 要件定義から順に工程を進め、原則として前の工程に戻らない開発手法。]
      - [DevSecOps, 開発と運用を一体で回す流れに、セキュリティの確認を自動化して組み込む考え方。]
      - [SQuaRE, ソフトウェア製品の品質を定義し、評価するための規格群。]
