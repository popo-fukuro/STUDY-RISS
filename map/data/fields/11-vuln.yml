id: vuln
order: 11
domain: dev
color: "#22695A"
name: 脆弱性管理・脆弱性診断・セキュリティ評価
short: 脆弱性管理と診断
shortLines: [脆弱性管理, と診断]
priority: high
badges: []
summary: 弱点を「見つける」「深刻さを測る」「優先順位を決めて直す」流れと、製品の安全性を第三者が評価する制度。
themes:
  - CVE・CWE・CVSSの区別
  - CVSSの指標と、EPSS・KEVによる優先度の判断
  - 脆弱性診断とペネトレーションテストの違い
  - ASM（外部に公開している資産の把握）
  - JVNと情報セキュリティ早期警戒パートナーシップ
  - コモンクライテリア（ISO/IEC 15408）・JCMVP
keywords: [CVE, CWE, CVSS, EPSS, KEV, SSVC, JVN, 脆弱性診断, ペネトレーションテスト, ASM, バグバウンティ]
examA2: CVSSの評価基準の内容、CVEとCWEの区別、評価制度（ISO/IEC 15408など）を問う。
examB: R7春 問2でCVSSv3とEPSS、R7春 問4でASMとKEVカタログ、R6秋 問4でWebサイトの診断結果の評価が題材になった。
official:
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「3. セキュリティ技術評価」}
  - {doc: シラバス Ver.2.1, where: 科目B 2-6 セキュリティテスト、3-6 脆弱性への対応}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類26「3 セキュリティ評価」}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4）に含まれる（追補版の「セキュリティ技術評価」）。直近の科目Bでは、R7春 問2（CVSSv3とEPSSによる優先度の判断）、R7春 問4（ASMとKEVカタログ）、R6秋 問4（診断で見つかった脆弱性の評価）が題材にしている。新制度のシラバス案では、KEV、EPSS、SSVC、SBOMを利用した脆弱性管理が用語例に明記され、サンプル問2もセキュリティ診断を題材にしている。
textbook: ["3.1", "5.3"]
subs:
  - id: ids
    name: 脆弱性情報と識別子
    terms:
      - [CVE, 公開された個々の脆弱性に付ける、世界共通の識別番号。]
      - [CWE, 脆弱性の「種類」（例：SQLインジェクション）を分類した一覧。]
      - [JVN, 日本で使われているソフトウェアの脆弱性情報と対策をまとめたポータルサイト。]
      - [情報セキュリティ早期警戒パートナーシップ, 脆弱性の発見者からの届出を受け、開発者と調整してから公表する日本の仕組み。]
      - [SCAP, 脆弱性の識別や設定の点検を自動化するための標準の集まり。, {aka: [セキュリティ設定共通化手順]}]
  - id: score
    name: 深刻度と優先度判断
    terms:
      - [CVSS, 脆弱性の深刻度を0.0〜10.0で評価する共通の基準。基本・現状・環境の3つの評価基準がある。, {aka: [共通脆弱性評価システム]}]
      - [攻撃条件の複雑さ（AC）, CVSSの基本評価基準の指標の一つ。攻撃の成功に特別な条件が要るかどうかを表す。, {sup: true, checked: true}]
      - [EPSS, その脆弱性が近いうちに悪用される確率を推定する指標。, {new: true}]
      - [KEV, 実際に悪用が確認された脆弱性をまとめたカタログ。優先して対処すべきものがわかる。]
      - [SSVC, 悪用の状況や影響などの質問を木の形にたどり、対応の優先度を決める手法。, {new: true}]
  - id: assess
    name: 脆弱性診断・ペンテスト
    terms:
      - [脆弱性診断, ツールと手作業で、システムに既知の種類の脆弱性がないかを網羅的に調べること。]
      - [ペネトレーションテスト, 攻撃者の目線で実際に侵入を試み、目的（情報の取得など）を達成できるかを確かめるテスト。]
      - [TLPT, 実在する攻撃者の手口を想定したシナリオで、組織の検知・対応まで含めて試すペネトレーションテスト。, {sup: true}]
      - [バグバウンティ, 外部の研究者が見つけた脆弱性の報告に、報奨金を払う制度。, {aka: [バグバウンティ, 脆弱性報奨金制度]}]
  - id: asm
    name: 資産管理とASM
    terms:
      - [ASM, インターネットから見える自社の資産を継続的に洗い出し、管理されていない入口を見つける活動。, {aka: [ASM, EASM], new: true}]
      - [資産インベントリ, 社内のサーバ・端末・ソフト・ドメインなどの一覧。脆弱性への対応の出発点になる。, {aka: [資産インベントリ], new: true}]
      - [サブドメインテイクオーバー, 使われなくなったサブドメインのDNSの設定が残り、第三者に乗っ取られること。, {sup: true, checked: true}]
      - [パッチ適用の判断, 脆弱性の深刻度と業務への影響を比べ、修正プログラムを当てるか、いつ当てるかを決めること。, {aka: [脆弱性修正プログラムの適用]}]
  - id: eval
    name: 製品・暗号の評価制度
    terms:
      - [ISO/IEC 15408（コモンクライテリア）, IT製品のセキュリティ機能を、第三者が評価・認証するための国際規格。, {aka: [ISO/IEC 15408, コモンクライテリア]}]
      - [EAL, コモンクライテリアで、評価の厳しさを7段階で示す指標（評価保証レベル）。, {aka: [EAL, 評価保証レベル]}]
      - [JISEC, 日本のITセキュリティ評価及び認証制度。]
      - [JCMVP, 暗号モジュールが正しく安全に作られているかを試験・認証する日本の制度。]
      - [FIPS 140, 暗号モジュールのセキュリティ要件を定めた米国の規格。]
