id: incident
order: 13
domain: resp
color: "#A8441A"
name: インシデント対応・フォレンジック・事業継続
short: インシデント対応
shortLines: [インシデント, 対応]
priority: high
badges: []
summary: 事故が起きたときに「被害を止め、原因を突き止め、元に戻し、再発を防ぐ」ための体制と手順。証拠の扱い方と、事業を止めないための備えも含む。
themes:
  - CSIRTの構築と役割
  - 対応の流れ（準備・検知と分析・封じ込め・根絶・復旧・事後対応）
  - トリアージと報告・公表の判断
  - 証拠保全とChain of Custody
  - マルウェア解析の方法
  - BCPとバックアップ（RTO／RPO、3-2-1ルール）
keywords: [CSIRT, トリアージ, 封じ込め, 証拠保全, Chain of Custody, 揮発性データ, デジタルフォレンジック, BCP, RTO, RPO, イミュータブルバックアップ]
examA2: CSIRTの役割、対応の手順の順序、フォレンジックの留意点、BCPの指標（RTO／RPO）などを問う。
examB: 直近5回では、R5秋 問1・問3、R6秋 問1・問3、R7秋 問1がインシデントの発生から対応までを題材にしている。R7秋 問4では、迅速な復旧のための平常時の備え（バックアップなど）が問われた。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目B 大項目4 情報セキュリティインシデント管理の推進又は支援}
  - {doc: シラバス Ver.2.1, where: 科目B 4-1〜4-4、3-3 バックアップ}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類25「インシデント管理」「事業継続とレジリエンス」、中分類26「2 フォレンジック」}
priorityReason: 科目Bの出題範囲の大項目4（インシデント管理）に当たる。直近の科目Bでは、R5秋 問1・問3、R6秋 問1・問3、R7秋 問1がインシデントの発生から対応までを題材にし、R7秋 問4ではレジリエンス（迅速な復旧）が問われた。新制度でも科目Bの大項目4は大きく変わらず維持される。
textbook: ["4.8", "4.9"]
subs:
  - id: csirt
    name: CSIRTと対応体制
    terms:
      - [CSIRT, 組織の中でセキュリティインシデントに対応するチーム。社内外との連絡の窓口にもなる。]
      - [PSIRT, 自社製品の脆弱性に対応するチーム。外部からの報告を受け、修正と公表を行う。]
      - [インシデントレスポンス計画（IRP）, インシデントが起きたときの役割分担や手順を、前もって文書にしたもの。, {aka: [インシデントレスポンス計画], new: true}]
      - [机上演習, 想定したシナリオに沿って、関係者が対応の流れを話し合いで確かめる訓練。, {new: true}]
  - id: process
    name: 対応プロセス
    terms:
      - [情報セキュリティ事象とインシデント, 事象は「起きたこと」、インシデントはそのうち事業に悪い影響を与える（おそれがある）もの。, {aka: [情報セキュリティ事象]}]
      - [トリアージ, 届いた報告を、影響の大きさや緊急度で仕分けし、対応の優先順位を決めること。]
      - [封じ込め・根絶・復旧, 被害の広がりを止め、原因（マルウェアなど）を取り除き、安全な状態に戻す段階。, {aka: [封じ込め], new: true}]
      - [事後レビュー, 対応を振り返り、手順や対策の改善につなげること。, {new: true}]
      - [報告と公表の判断, 監督官庁や本人への報告、報道発表などを、法令と影響の大きさに応じて判断すること。, {aka: [公表の判断], new: true}]
  - id: forensics
    name: フォレンジック
    terms:
      - [デジタルフォレンジック, 電子機器に残る記録を、証拠として使える形で集めて分析する技術。, {aka: [デジタルフォレンジック, フォレンジックス]}]
      - [証拠保全, 記録を変更しないようにコピーし、元の状態を保つこと。]
      - [揮発性データの収集順序, メモリの内容など電源を切ると消えるデータを、消えやすい順に先に集めること。, {aka: [揮発性データ], new: true}]
      - [Chain of Custody, 証拠を誰がいつどう扱ったかを途切れなく記録し、改ざんがないことを示すこと。]
      - [ハッシュ値による同一性の証明, 原本とコピーのハッシュ値が一致することで、同じデータだと示すこと。, {new: true}]
  - id: malanalysis
    name: マルウェア解析
    terms:
      - [静的解析／動的解析, プログラムを動かさずに中身を調べる方法と、隔離した環境で動かして挙動を観察する方法。, {aka: [静的解析, 動的解析]}]
      - [逆アセンブル, 機械語のプログラムを、人が読めるアセンブリ言語に戻して解析すること。]
      - [パッカー・難読化, 解析を難しくするために、プログラムを圧縮・暗号化したり読みにくくしたりする技術。, {aka: [パッカー, 難読化]}]
      - [ハニーポット, わざと攻撃されやすく見せたおとりのシステム。攻撃の手口を観察する。]
  - id: bcp
    name: 事業継続とバックアップ
    terms:
      - [BCP（事業継続計画）, 災害や攻撃で業務が止まっても、重要な業務を続け、早く再開するための計画。, {aka: [事業継続計画]}]
      - [RTO／RPO, 何時間以内に復旧するかの目標（RTO）と、どの時点までのデータを取り戻すかの目標（RPO）。, {aka: [RTO, RPO]}]
      - [3-2-1ルール, バックアップを3つ持ち、2種類の媒体に分け、1つは離れた場所に置くという原則。]
      - [イミュータブルバックアップ, 決めた期間、変更も削除もできないバックアップ。ランサムウェアに消されにくい。]
      - [ホットサイト／コールドサイト, すぐに切り替えられる設備を常に用意しておく代替拠点と、場所だけを確保しておく代替拠点。, {aka: [ホットサイト, コールドサイト]}]
