id: crypto
order: 3
domain: cryptoauth
color: "#653C93"
name: 暗号技術
short: 暗号技術
priority: high
badges: []
summary: 情報を「読めなくする」「改ざんを見破る」「本人が作ったと証明する」ための道具箱。認証・安全な通信・電子署名など、多くの技術の部品になる。
themes:
  - 共通鍵暗号と公開鍵暗号の使い分け（ハイブリッド暗号）
  - ハッシュ・MAC・デジタル署名の違い
  - 証明書の検証とPKI（証明書チェーン、失効確認）
  - 鍵管理（HSM、鍵の暗号化、鍵のライフサイクル）
  - 前方秘匿性と耐量子計算機暗号
keywords: [AES, RSA暗号, 楕円曲線暗号, SHA-256, HMAC, デジタル署名, PKI, OCSP, HSM, 前方秘匿性]
examA2: 暗号方式の特徴、ハッシュ関数の性質、証明書の失効確認などの知識を問う。
examB: R7秋 問2で暗号鍵の管理と署名の生成・検証、R5秋 問2でサーバ証明書の検証と秘密鍵の管理、R7春 問3でプライベートCAのルート証明書が題材になった。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類11 セキュリティ（◎4）}
  - {doc: シラバス Ver.2.1, where: 科目B 3-1 暗号利用及び鍵管理}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類25「7 暗号技術」}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4）。直近の科目Bでは、R7秋 問2（暗号資産交換業の暗号鍵管理）、R5秋 問2（サーバ証明書の検証・秘密鍵の管理）、R7春 問3（プライベートCAのルート証明書）、R5秋 問3（HSM）が暗号を題材にしている。新制度のシラバス案でも小分類「暗号技術」として独立し、耐量子計算機暗号（PQC）や暗号アジリティが用語例に加わった。
textbook: ["7.1", "7.4", "7.7"]
subs:
  - id: symmetric
    name: 共通鍵暗号
    terms:
      - [AES, 現在の標準的な共通鍵のブロック暗号。鍵の長さは128・192・256ビット。]
      - [ブロック暗号／ストリーム暗号, 決まった長さのかたまりごとに暗号化する方式と、ビットやバイトの単位で連続して暗号化する方式。, {aka: [ブロック暗号, ストリーム暗号]}]
      - [暗号利用モード, ブロック暗号で長いデータを暗号化するときのつなぎ方（CBC、CTR、GCMなど）。]
      - [認証付き暗号（AEAD）, 暗号化と改ざんの検知を同時に行う方式。AES-GCMが代表例。, {aka: [AEAD, 認証付き暗号]}]
  - id: pubkey
    name: 公開鍵暗号と鍵交換
    terms:
      - [RSA暗号, 大きな数の素因数分解が難しいことを安全性の根拠にする公開鍵暗号。, {aka: [RSA]}]
      - [楕円曲線暗号, RSAより短い鍵で同じ程度の強さを出せる公開鍵暗号。]
      - [ハイブリッド暗号, データは高速な共通鍵暗号で暗号化し、その共通鍵を公開鍵暗号で安全に渡す方式。]
      - [Diffie-Hellman鍵交換, 盗聴されている通信路でも、双方だけが知る共通の鍵を作れる手順。, {aka: [Diffie-Hellman]}]
      - [前方秘匿性（PFS）, 長く使う秘密鍵が後で漏れても、過去の通信は解読されない性質。, {aka: [前方秘匿性, PFS]}]
  - id: hash
    name: ハッシュとMAC
    terms:
      - [ハッシュ関数, どんな長さのデータからも固定長の値を作る関数。元に戻せず、少しの変更で値が大きく変わる。]
      - [衝突発見困難性, 同じハッシュ値になる別々のデータを見つけるのが難しい性質。]
      - [SHA-256, 広く使われるSHA-2系のハッシュ関数。MD5やSHA-1は安全性が失われている。, {aka: [SHA-2, SHA-256]}]
      - [メッセージ認証符号（MAC）, 共通鍵とデータから作る値。改ざんと、鍵を持つ相手が作ったことを確かめられる。, {aka: [メッセージ認証符号]}]
      - [HMAC, ハッシュ関数と共通鍵を組み合わせてMACを作る代表的な方式。]
  - id: pki
    name: デジタル署名とPKI
    terms:
      - [デジタル署名, 秘密鍵で署名し、公開鍵で検証する仕組み。改ざんの検知と否認防止ができる。]
      - [認証局（CA）, 公開鍵の持ち主を確認し、デジタル証明書を発行する機関。, {aka: [認証局]}]
      - [X.509証明書, 公開鍵と持ち主の情報にCAが署名した、デジタル証明書の標準形式。, {aka: [X.509]}]
      - [証明書パス検証, サーバ証明書から中間CA、ルートCAへと署名を順にたどり、信頼できるかを確かめること。]
      - [CRL／OCSP, 証明書が失効していないかを確かめる仕組み。失効した証明書の一覧を配る方式と、問合せに答える方式。, {aka: [CRL, OCSP]}]
  - id: keymgmt
    name: 鍵管理とHSM
    terms:
      - [鍵のライフサイクル, 鍵の生成・配送・保管・更新・廃棄までの一連の管理。, {new: true}]
      - [HSM, 暗号鍵を安全に生成・保管し、鍵を外に出さずに暗号処理を行う専用の装置。]
      - [鍵管理システム（KMS）, クラウドなどで、暗号鍵の作成・更新・利用権限を一元管理する仕組み。, {aka: [KMS, 鍵管理システム]}]
      - [危殆化, 計算機の進歩や攻撃手法の発見で、暗号の安全性が保てなくなること。]
      - [CRYPTREC暗号リスト, 日本の電子政府で使うことが推奨される暗号の一覧。, {aka: [CRYPTREC]}]
  - id: future
    name: 新しい暗号技術
    terms:
      - [耐量子計算機暗号（PQC）, 量子コンピュータでも解読が難しいとされる新しい公開鍵暗号。, {aka: [耐量子計算機暗号, PQC]}]
      - [暗号アジリティ, 弱くなった暗号を、システムを大きく作り直さずに別の暗号へ切り替えられる設計。, {new: true}]
