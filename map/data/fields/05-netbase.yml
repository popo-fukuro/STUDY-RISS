id: netbase
order: 5
domain: infra
color: "#1B5A8E"
name: ネットワーク基礎
short: ネットワーク基礎
shortLines: [ネットワーク, 基礎]
priority: high
badges: []
summary: パケットがどう届くか、名前がどう解決されるか、メールやWebがどう動くかといった通信のしくみの基本。攻撃も防御も、このしくみの上で起きる。
themes:
  - TCP/IPの階層とポート番号
  - DNSの名前解決（権威DNSサーバとキャッシュDNSサーバの役割）
  - SMTP・POP・IMAPとメールの流れ
  - HTTPとCookie、プロキシ
  - 無線LANと認証（WPA3、IEEE 802.1X）
  - NAT・VLAN・ネットワーク管理（SNMP、syslog、NTP）
keywords: [TCP, UDP, ARP, DHCP, DNS, CNAME, SMTP, HTTP, NAT, VLAN]
examA2: 科目A-2の重点分野（ネットワーク◎4）。プロトコルの動作、ヘッダやポートの知識を問う。
examB: 設問の前提として、DNS・メール・HTTPの動作の理解が求められる（R7春 問4：CNAMEの削除漏れによるサブドメインテイクオーバー、R6秋 問2：メールサービスの設定、R7秋 問3：VPN接続前に必要な通信）。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類10 ネットワーク（◎4）}
  - {doc: シラバス追補版 Ver.4.0, where: 中分類10 ネットワーク}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類16 ネットワーク（科目A-2で●）}
priorityReason: 試験要綱で科目A-2の重点分野（ネットワーク◎4）に指定されており、新制度の科目A-2でも中分類16ネットワークが「専門分野かつ重点分野（●）」になっている。直近の科目Bでは、R7春 問4（DNSのCNAMEレコードの削除漏れ）、R6秋 問2（メールの送受信の設定）、R7秋 問3（VPN接続前に必要な通信）、R5秋 問2（無線LAN）がネットワークの理解を前提にしている。
textbook: ["1.4", "3.3", "3.4", "3.5"]
subs:
  - id: tcpip
    name: TCP/IPと階層モデル
    terms:
      - [OSI基本参照モデル, 通信の機能を7つの層に分けて整理したモデル。, {aka: [OSI]}]
      - [TCP／UDP, 確認応答で確実に届けるTCPと、確認をせず軽く速いUDP。, {aka: [TCP, UDP]}]
      - [ポート番号, 1台の機器の中で、どのアプリあての通信かを区別する番号。Webは443、メール送信は25など。, {aka: [ポート番号]}]
      - [ARP, IPアドレスから、同じLANの中にある機器のMACアドレスを調べるプロトコル。]
      - [DHCP, 接続した機器に、IPアドレスなどの設定を自動で配るプロトコル。]
      - [NAT／NAPT, 内部のプライベートIPアドレスを、外部用のグローバルIPアドレスに変換する技術。, {aka: [NAT, NAPT]}]
  - id: dns
    name: DNS
    terms:
      - [権威DNSサーバ, 自分が管理するドメインの正式な情報を答えるサーバ。, {aka: [権威DNS, 権威サーバ], sup: true}]
      - [キャッシュDNSサーバ, 利用者の代わりに問合せを繰り返し、結果を一時的に保存するサーバ。フルリゾルバとも呼ぶ。, {aka: [キャッシュDNS, フルリゾルバ], sup: true}]
      - [CNAMEレコード, ある名前を、別の名前の別名として登録するレコード。使わなくなったら削除しないと乗っ取りの原因になる。, {aka: [CNAME], sup: true}]
      - [オープンリゾルバ, 誰からの問合せにも答えてしまうキャッシュDNSサーバ。DNSアンプ攻撃の踏み台になる。]
  - id: mail
    name: メールの仕組み
    terms:
      - [SMTP, メールを送信・転送するプロトコル。もともと送信者を確かめる機能がない。]
      - [POP3／IMAP4, メールサーバからメールを受け取るプロトコル。IMAPはメールをサーバ上に置いたまま管理する。, {aka: [POP3, IMAP]}]
      - [SMTP-AUTH, メールを送るときに、送信サーバで利用者を認証する仕組み。]
      - [OP25B, プロバイダの網の中から外部への25番ポートの直接送信を止め、迷惑メールの送信を防ぐ対策。]
  - id: http
    name: HTTPとWeb通信
    terms:
      - [HTTP／HTTPS, Webのデータをやり取りするプロトコル。HTTPSはTLSで暗号化したもの。, {aka: [HTTP, HTTPS]}]
      - [Cookie, Webサーバがブラウザに保存させる小さなデータ。ログイン状態の維持などに使う。, {aka: [cookie]}]
      - [プロキシサーバ, 利用者の代わりにWebサーバへアクセスする中継サーバ。アクセス制御やログの取得に使う。, {aka: [プロキシ]}]
      - [CDN, 各地のサーバにコンテンツを複製して配信し、速く届ける仕組み。大量のアクセスの分散にも役立つ。]
  - id: lan
    name: LAN・無線LAN
    terms:
      - [VLAN, 1つのスイッチの中で、ネットワークを論理的に分ける技術。]
      - [WPA3, 無線LANの通信を暗号化・認証する最新の規格。Personal（事前共有鍵）とEnterprise（認証サーバ）がある。]
      - [IEEE 802.1X, LANや無線LANにつなぐときに、利用者や端末を認証する規格。RADIUSサーバと組み合わせる。, {aka: [802.1X]}]
      - [RADIUS, ネットワークへの接続時の認証・認可・利用記録を集中して行うプロトコル。]
  - id: mgmt
    name: ネットワーク管理
    terms:
      - [SNMP, ネットワーク機器の状態を監視・管理するプロトコル。]
      - [syslog, 機器のログを集めるための標準的な仕組み。]
      - [NTP, 機器の時刻を合わせるプロトコル。複数の機器のログの時刻をそろえるために重要。]
      - [パケットキャプチャ, 流れている通信を記録して中身を調べること。障害調査や攻撃の分析に使う。, {aka: [パケットアナライザ, パケットキャプチャ]}]
