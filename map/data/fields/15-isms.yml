id: isms
order: 15
domain: mgmt
color: "#3B4C66"
name: ISMS・管理策・セキュリティガバナンス・監査
short: ISMS・監査
shortLines: [ISMS・, 監査]
priority: mid
badges: [new-weight]
summary: 組織としてセキュリティを継続的に回す仕組み（ISMS）と、その中身となる管理策、経営者による方向づけ（ガバナンス）、第三者によるチェック（監査）。
themes:
  - ISMS（JIS Q 27001）とPDCA
  - JIS Q 27002の管理策（組織・人・物理・技術）
  - 情報セキュリティ方針と規程類
  - 人的管理（教育・内部不正の防止）と物理的管理（入退管理）
  - セキュリティガバナンスと内部統制
  - 情報セキュリティ監査・システム監査
keywords: [ISMS, JIS Q 27001, JIS Q 27002, 情報セキュリティ方針, 職務の分離, 入退管理, 内部不正防止ガイドライン, 情報セキュリティガバナンス, 内部統制, システム監査]
examA2: ISMSの要求事項、管理策の分類、監査の手順や監査人の独立性（システム監査○3）などを問う。
examB: 規程や体制づくりは、各問の対策を立てるときに使う。R7秋 問4（セキュリティ管理体制の構築）が組織的な管理を題材にしている。
official:
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「2. 情報セキュリティ管理」、中分類16 システム監査（○3）}
  - {doc: シラバス Ver.2.1, where: 科目B 1-1 方針、1-4 諸規程、1-5 監査、3-7 物理、3-9 人的管理}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類24「5 ISMS」「6 情報セキュリティ管理策」、中分類12 ガバナンス・監査}
priorityReason: 試験要綱ではセキュリティ（◎4）の「情報セキュリティ管理」に含まれ、システム監査は科目A-2で○3。直近の科目Bでは、R7秋 問4（サプライチェーンの中の企業のセキュリティ管理体制の構築）が組織的な管理を題材にしている。新制度の科目Bでは「マネジメント分野の強化」として、大項目1にセキュリティ運用状況の管理・点検、人的管理、AIの安全な導入・利用に関する規程、デジタルガバナンス確保への対応が加わった。
textbook: ["1.3", "4.3", "4.4", "4.6", "4.7", "4.10"]
subs:
  - id: isms
    name: ISMSとPDCA
    terms:
      - [ISMS, 組織が情報セキュリティを計画・実行・点検・改善し続けるための仕組み。]
      - [JIS Q 27001, ISMSの要求事項を定めた規格（ISO/IEC 27001）。認証の審査の基準になる。, {aka: [JIS Q 27001, ISO/IEC 27001]}]
      - [ISMS適合性評価制度, 第三者の審査機関が、組織のISMSが規格に合っているかを審査・認証する制度。]
      - [ISMSの適用範囲, ISMSで管理する組織・場所・資産の範囲。, {aka: [ISMS 適用範囲, 適用範囲]}]
  - id: controls
    name: 管理策（組織・人・物理）
    terms:
      - [JIS Q 27002, ISMSで使う管理策（組織・人・物理・技術の4種類）の手引きとなる規格（ISO/IEC 27002）。, {aka: [JIS Q 27002, ISO/IEC 27002]}]
      - [職務の分離, 申請と承認など、一人に権限が集中しないよう担当を分けること。, {new: true}]
      - [入退管理, 部屋や建物に入れる人を制限し、出入りを記録すること。]
      - [アンチパスバック, 入室の記録がないと退室できないようにして、共連れを防ぐ入退管理の仕組み。]
      - [内部不正防止ガイドライン, 組織の中の不正を防ぐための対策をまとめたIPAの指針。, {aka: [組織における内部不正防止ガイドライン]}]
      - [セキュリティ教育・訓練, 標的型メール訓練などで、従業員の意識と対応力を高めること。, {aka: [情報セキュリティ訓練, 教育・訓練]}]
  - id: policy
    name: 方針と規程
    terms:
      - [情報セキュリティ方針, 経営者が示す、組織の情報セキュリティへの基本的な考え方。情報セキュリティポリシーとも呼ぶ。, {aka: [情報セキュリティ方針, 情報セキュリティポリシー]}]
      - [対策基準と実施手順, 方針を具体化した守るべきルールと、現場の作業の手順。, {sup: true}]
      - [秘密保持契約, 業務で知った秘密を漏らさないことを約束する契約。NDAとも呼ぶ。]
      - [懲戒手続, 規程に違反した従業員への処分の手続。違反を思いとどまらせる効果もある。]
  - id: gov
    name: ガバナンスと内部統制
    terms:
      - [情報セキュリティガバナンス, 経営者が情報セキュリティの方向を示し、取組みを監督する仕組み。]
      - [内部統制, 業務を適正かつ効率的に行うために、組織の中に組み込む管理の仕組み。]
      - [デジタルガバナンス, デジタル技術の活用に伴うリスクを、経営として管理・監督すること。]
  - id: audit
    name: 監査
    terms:
      - [情報セキュリティ監査, 情報セキュリティの対策が適切かを、独立した立場から評価すること。]
      - [システム監査, 情報システムの信頼性・安全性・効率性を、独立した監査人が点検・評価すること。]
      - [監査証拠, 監査人が意見の根拠として集める記録。ログ、文書、聞き取りの結果など。]
      - [監査人の独立性, 監査人が監査の対象から独立し、公正に判断できる立場にあること。, {aka: [独立性]}]
