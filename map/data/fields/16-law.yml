id: law
order: 16
domain: mgmt
color: "#575B6E"
name: 法律・規格・ガイドライン・関連組織
short: 法令・規格・組織
shortLines: [法令・規格・, 組織]
priority: low
badges: []
summary: セキュリティにかかわる法律、国際規格、国のガイドライン、関係する機関。何が違法か、どこに届け出るか、何を根拠にルールを作るかがわかる。
themes:
  - 不正アクセス禁止法と刑法（不正指令電磁的記録に関する罪など）
  - 個人情報保護法（漏えい時の報告と本人への通知）
  - サイバーセキュリティ基本法と国の推進体制
  - サイバーセキュリティ経営ガイドライン
  - JPCERT/CC・IPAなどの関係機関
  - 届出制度・評価制度（ISMAPなど）
keywords: [不正アクセス禁止法, 個人情報保護法, サイバーセキュリティ基本法, 不正競争防止法, 電子署名法, サイバーセキュリティ経営ガイドライン, JPCERT/CC, ISMAP]
examA2: 科目A-2では、セキュリティ分野の中のガイドライン・基準や関連組織として問われる。中分類「法務」そのものは、SCの科目A-2の対象外（科目A-1の範囲）。
examB: コンプライアンス管理（現行は大項目3、新制度では大項目1）として、対策を立てるときの前提になる。直近5回では、法令そのものを主な題材にした問はない。
official:
  - {doc: シラバス Ver.2.1, where: 科目B 3-11 コンプライアンス管理、1-7 関係者とのコミュニケーション}
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「2. 情報セキュリティ管理」の(7)組織・機関、(8)基準}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類24「4 情報セキュリティ関連組織・関連制度」}
priorityReason: 試験要綱の科目A-2の表では、中分類23「法務」はSCの対象外で、法令はセキュリティ分野の基準・ガイドラインとして扱われる。直近5回の科目Bでは、法令そのものを主な題材にした問はない。新制度では法規（中分類28〜30）は科目A-1（共通知識）の範囲で、SCの科目A-2には含まれていない。ただし科目Bのコンプライアンス管理には、AI関連のガイドラインが加わった。
textbook: ["9.1", "9.2", "9.3", "9.4", "9.5", "9.6"]
subs:
  - id: cyberlaw
    name: サイバー関連の法律
    terms:
      - [不正アクセス禁止法, 他人のIDとパスワードを無断で使うなどの不正アクセス行為や、それを助ける行為を禁じる法律。]
      - [不正指令電磁的記録に関する罪, 正当な理由なくコンピュータウイルスを作る・提供する・保管することなどを罰する刑法の規定。, {aka: [不正指令電磁的記録]}]
      - [サイバーセキュリティ基本法, 国・自治体・事業者などの責務と、国の推進体制を定めた法律。]
      - [情報流通プラットフォーム対処法, 大規模なSNSなどに、権利を侵害する投稿への迅速な対応を求める法律（旧プロバイダ責任制限法）。]
  - id: privacy
    name: 個人情報・プライバシー
    terms:
      - [個人情報保護法, 個人情報を扱う事業者のルールを定めた法律。漏えいしたときは委員会への報告と本人への通知が必要な場合がある。]
      - [要配慮個人情報, 病歴や犯罪の経歴など、取り扱いに特に注意が必要な個人情報。]
      - [マイナンバー法, マイナンバーを使える範囲や管理の方法を厳しく定めた法律。]
      - [JIS Q 15001, 個人情報保護のマネジメントシステムの規格。プライバシーマーク制度の基準になる。]
  - id: ip
    name: 知財・電子文書の法律
    terms:
      - [不正競争防止法, 秘密として管理された営業秘密を、不正に取得・使用することなどを禁じる法律。]
      - [著作権法, プログラムなどの著作物を作った人の権利を守る法律。]
      - [電子署名法, 本人による電子署名がある電子文書は、本人が作ったものと推定されることを定めた法律。, {aka: [電子署名及び認証業務]}]
      - [タイムスタンプ, ある時刻にその電子データが存在し、それ以後改ざんされていないことを証明する仕組み。]
  - id: standards
    name: 規格とガイドライン
    terms:
      - [サイバーセキュリティ経営ガイドライン, 経営者が主導してサイバーセキュリティ対策を進めるための、経済産業省とIPAの指針。]
      - [NIST サイバーセキュリティフレームワーク, 識別・防御・検知・対応・復旧などの機能で対策を整理する米国の枠組み。, {aka: [NIST サイバーセキュリティフレームワーク, CSF]}]
      - [NIST SP 800シリーズ, 米国NISTが出しているセキュリティの指針文書。SP 800-61はインシデント対応、SP 800-207はゼロトラスト。, {aka: [NIST SP 800]}]
      - [政府機関等の統一基準群, 政府機関などが守るべきサイバーセキュリティ対策の基準。, {aka: [統一基準群]}]
  - id: orgs
    name: 国内外の関連組織
    terms:
      - [JPCERT/CC, 日本のインシデント対応の調整や、脆弱性情報の流通を担う組織。, {aka: [JPCERT]}]
      - [IPA, 情報処理推進機構。試験の実施や脆弱性の届出の受付、セキュリティ情報の発信を行う。]
      - [国家サイバー統括室（NCO）, 国のサイバーセキュリティ政策の中心となる組織（旧NISC）。, {aka: [国家サイバー統括室], new: true}]
      - [ISAC, 同じ業界の組織どうしで、脅威や攻撃の情報を共有する組織。]
      - [J-CSIP／J-CRAT, IPAが運営する、標的型攻撃などの情報共有の枠組み（J-CSIP）と、被害組織を支援するチーム（J-CRAT）。, {aka: [J-CSIP, J-CRAT]}]
  - id: system
    name: 届出・評価制度
    terms:
      - [コンピュータ不正アクセス届出制度, 不正アクセスの被害をIPAに届け出る制度。]
      - [ISMAP, 政府が使うクラウドサービスの安全性を評価し、登録する制度。]
      - [情報セキュリティサービス基準, 脆弱性診断や監視などのセキュリティサービスが一定の品質を満たすかを確かめる基準。]
      - [情報処理安全確保支援士制度, 登録セキスペの名称独占と、秘密保持・講習受講の義務を定めた国家資格の制度。, {aka: [情報処理安全確保支援士]}]
