id: web
order: 9
domain: dev
color: "#2B714A"
name: Webアプリケーションセキュリティ・セキュアプログラミング
short: Webセキュリティ
shortLines: [Web, セキュリティ]
priority: high
badges: []
summary: Webアプリの典型的な弱点と、作り方での防ぎ方。科目Bでは、HTML・JavaScript・Javaなどのコードを読んで、原因と対策を答える力が問われる。
themes:
  - XSS（反射型・格納型・DOM型）と出力時のエスケープ
  - SQLインジェクションとプレースホルダ
  - CSRFとトークン、セッション管理（固定化への対策）
  - CSP・Cookieの属性・CORSなどブラウザの防御機構
  - APIとJWT、スマホアプリに秘密情報を置かない設計
  - 言語ごとの注意点（C/C++のバッファ、Javaの例外処理）
keywords: [XSS, SQLインジェクション, CSRF, セッションフィクセーション, CSP, SameSite, CORS, SRI, プレースホルダ, エスケープ処理]
examA2: 攻撃と対策の対応（例：XSSには出力時のエスケープ、SQLインジェクションにはプレースホルダ）を問う。
examB: 直近5回の20問のうち、R5秋 問1、R6春 問1・問3・問4、R6秋 問3・問4、R7春 問3、R7秋 問1の8問が、Webアプリやアプリの実装を主な題材にしている。
official:
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「5. セキュリティ実装技術」の(6)アプリケーションセキュリティ}
  - {doc: シラバス Ver.2.1, where: 科目B 2-5 セキュアプログラミング}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類26「アプリケーション開発のセキュリティ」}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4）に含まれ、科目Bでは小項目2-5（セキュアプログラミング）に当たる。直近の科目Bでは、R5秋 問1、R6春 問1・問3・問4、R6秋 問3・問4、R7春 問3、R7秋 問1がWebアプリや実装を主な題材にしている。新制度のサンプル問2もWebサイトのセッションフィクセーションを題材にしている。
textbook: ["2.5", "2.8", "3.6", "8.2", "8.3", "8.4"]
subs:
  - id: vuln
    name: Webの主な脆弱性
    terms:
      - [クロスサイトスクリプティング（XSS）, 利用者の入力をそのままページに出力したため、悪意あるスクリプトが閲覧者のブラウザで動いてしまう脆弱性。, {aka: [クロスサイトスクリプティング], note: ch03/xss-vs-csrf.md}]
      - [反射型／格納型／DOM型XSS, スクリプトがリクエストからそのまま返る型、サーバに保存されて表示される型、ブラウザ側のJavaScriptだけで起きる型。, {aka: [反射型, 格納型]}]
      - [SQLインジェクション, 入力にSQLの断片を混ぜて、データベースを不正に操作する攻撃。]
      - [クロスサイトリクエストフォージェリ（CSRF）, ログイン中の利用者に、罠のページから本人の意図しないリクエストを送らせる攻撃。, {aka: [クロスサイトリクエストフォージェリ, CSRF], note: ch03/xss-vs-csrf.md}]
      - [OSコマンドインジェクション, 入力を通じて、サーバ上でOSのコマンドを実行させる攻撃。]
      - [ディレクトリトラバーサル, 「../」などでファイルの場所をさかのぼり、公開していないファイルを読む攻撃。]
  - id: session
    name: セッション管理
    terms:
      - [セッションハイジャック, 他人のセッションIDを盗んで、その人になりすます攻撃。]
      - [セッションフィクセーション, 攻撃者が用意したセッションIDを利用者に使わせ、ログイン後に乗っ取る攻撃。ログイン時にIDを新しく発行して防ぐ。, {aka: [セッション固定化, セッションフィクセーション], new: true}]
      - [CSRFトークン, フォームに推測できない値を埋め込み、正規の画面からの送信かを確かめる対策。, {new: true}]
      - [オープンリダイレクト, 任意のURLへ転送できる機能を悪用し、正規のサイトを経由して偽サイトへ誘導する手口。]
  - id: browser
    name: ブラウザの防御機構
    terms:
      - [同一オリジンポリシー, スキーム・ホスト・ポートの組が違うオリジンのデータを、スクリプトから勝手に読めないようにするブラウザの制限。, {aka: [Same Origin Policy]}]
      - [CORS, 同一オリジンポリシーの例外として、サーバが許可したほかのオリジンからのアクセスを認める仕組み。]
      - [Cookieの属性, Secure（HTTPSでだけ送る）、HttpOnly（スクリプトから読ませない）、SameSite（ほかのサイトからの送信を制限）。, {aka: [HttpOnly, SameSite], new: true}]
      - [CSP, 読み込んでよいスクリプトなどの出どころを、サーバからブラウザに指示する仕組み。XSSの被害を減らす。]
      - [HSTS, 以後はHTTPSでだけ接続するよう、ブラウザに覚えさせる仕組み。]
      - [SRI, 外部から読み込むスクリプトのハッシュ値を指定し、改ざんされていたら実行させない仕組み。]
  - id: api
    name: API・スマホアプリ
    terms:
      - [OWASP Top 10, Webアプリの重大なリスクをまとめた代表的な一覧。]
      - [OWASP API Security Top 10, APIに特有の主なリスク（認可の不備など）をまとめた一覧。, {new: true}]
      - [認可の不備, IDを書き換えるだけで他人のデータを取得できるなど、権限の確認が漏れている脆弱性。, {aka: [認可・権限・アクセス制御の不備]}]
      - [パスワードのハードコード, 秘密情報をプログラムに直接書き込むこと。アプリを解析されれば取り出されてしまう。]
  - id: code
    name: 言語別の安全な実装
    terms:
      - [エスケープ処理, 出力先で特別な意味を持つ文字を、ただの文字として表示されるよう変換すること。XSS対策の基本。, {new: true}]
      - [プレースホルダ, SQL文の形を先に固定し、値を後から当てはめる方式。SQLインジェクション対策の基本。]
      - [バッファオーバーフロー, 確保した領域を超えて書き込み、プログラムを異常終了させたり乗っ取ったりする脆弱性。C/C++で特に注意する。]
      - [ソルトとストレッチング, パスワードのハッシュに利用者ごとの乱数を加え、計算を何度も繰り返して解読を遅らせる対策。, {aka: [ソルト, ストレッチング]}]
      - [例外処理とリソースの解放, 例外が起きても後始末（Javaのfinallyなど）を必ず行い、情報漏えいや資源の枯渇を防ぐ実装。, {sup: true}]
      - [レースコンディション, 複数の処理の実行順序のずれを突かれて、想定外の状態になる脆弱性。]
