id: basics
order: 1
domain: base
color: "#8E3646"
name: 情報セキュリティの基礎理論
short: セキュリティ基礎
shortLines: [セキュリティ, 基礎]
priority: mid
badges: []
summary: 情報セキュリティで「何を」「なぜ」守るのかを整理する土台。機密性・完全性・可用性（CIA）などの考え方は、ほかのすべての分野で対策を選ぶときの物差しになる。
themes:
  - CIAと、真正性・責任追跡性・否認防止・信頼性を加えた7要素の区別
  - 脅威・脆弱性・リスクの関係
  - 多層防御・最小権限・セキュリティ・バイ・デザインなどの設計原則
  - ゼロトラストと境界型防御の違い
  - 不正のトライアングルと内部不正
keywords: [機密性, 完全性, 可用性, 否認防止, 多層防御, 最小権限, ゼロトラスト, 不正のトライアングル]
examA2: 用語の定義や要素の区別を問う知識問題として出る（例：ある対策が7要素のどれを高めるか）。
examB: 直近5回の科目Bで、この分野だけを主な題材にした問はない。各問で「この対策は何を守るためか」「何が損なわれたか」を説明するときの共通の言葉として使う。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類11 セキュリティ（◎4）}
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「1. 情報セキュリティ」}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類24「1 情報セキュリティの考え方」}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4）に含まれる基礎事項。直近5回の科目B（R5秋〜R7秋）で、この分野を主な題材にした問はない。新制度のシラバス案では「セキュリティ・バイ・デザイン」「攻撃対象領域の最小化」などの原則が用語例に明記されたが、範囲そのものの拡大ではない。
textbook: ["1.1", "1.2", "1.7"]
subs:
  - id: cia
    name: CIAと7要素
    terms:
      - [機密性, 許可された人だけが情報を見られる性質。暗号化やアクセス制御で守る。]
      - [完全性, 情報が正しく、勝手に書き換えられていない性質。ハッシュ値や署名で確かめる。]
      - [可用性, 必要なときに情報やシステムを使える性質。冗長化やバックアップで守る。]
      - [真正性, 利用者や情報が「本物である」と確かめられる性質。認証で確保する。]
      - [責任追跡性, 誰がいつ何をしたかを後からたどれる性質。ログの記録で確保する。]
      - [否認防止, 行った操作や送った事実を、後から「やっていない」と言えなくする性質。デジタル署名などで実現する。]
      - [信頼性, システムが意図したとおりに、一貫して動く性質。]
  - id: risk
    name: 脅威・脆弱性・リスク
    terms:
      - [情報資産, 守る対象となる情報・機器・サービス・人の知識など、組織にとって価値のあるもの。]
      - [脅威, 情報資産に損害を与えるおそれのある原因。攻撃者、災害、操作ミスなど。]
      - [脆弱性, 脅威につけ込まれる弱点。設定ミス、プログラムの欠陥、教育不足など。]
      - [攻撃対象領域（アタックサーフェス）, 外部から攻撃できる入口の総量。公開サーバや開いているポートが増えるほど広がる。, {aka: [攻撃対象領域, アタックサーフェス]}]
  - id: principle
    name: 設計原則
    terms:
      - [多層防御, 性質の異なる対策を何重にも重ね、一つが破られても次で止める考え方。]
      - [最小権限の原則, 利用者やプログラムに、仕事に必要な最小限の権限だけを与える考え方。, {aka: [最小権限]}]
      - [need-to-knowの原則, 業務上知る必要がある人だけに情報を見せる原則。, {aka: [need-to-know]}]
      - [セキュリティ・バイ・デザイン, 企画・設計の段階からセキュリティを組み込む考え方。後から足すより安く確実。, {aka: [セキュリティバイデザイン]}]
      - [セキュア・バイ・デフォルト, 初期設定のままで安全な状態になるように製品を作る考え方。, {new: true}]
      - [フェイルセーフ／フェイルセキュア, 故障時に被害が出ない側（止める）へ倒すのがフェイルセーフ、守りを固める側（閉じる）へ倒すのがフェイルセキュア。, {aka: [フェイルセーフ, フェイルセキュア, フェールセーフ]}]
  - id: zt
    name: ゼロトラストと境界防御
    terms:
      - [境界型防御, 社内と社外の境目にファイアウォールなどを置き、内側を信頼する守り方。, {aka: [境界防御], new: true}]
      - [ゼロトラスト, 場所にかかわらずすべてのアクセスを信頼せず、毎回確かめてから必要な分だけ許可する考え方。, {note: ch01/zero-trust.md}]
      - [マイクロセグメンテーション, ネットワークを細かい区画に分け、区画の間の通信を必要なものだけに絞る手法。, {new: true}]
      - [PDP／PEP, ゼロトラストで、アクセスの可否を判断する部分（PDP）と、その判断を実際に適用する部分（PEP）。, {aka: [ポリシー決定ポイント, PDP], new: true}]
  - id: actor
    name: 攻撃者と不正の動機
    terms:
      - [不正のトライアングル, 「動機」「機会」「正当化」の3つがそろうと不正が起きやすいという考え方。内部不正対策の基本。]
      - [内部不正, 従業員や委託先など、正規の権限を持つ人による情報の持出しや破壊。]
      - [ハクティビズム, 政治的・社会的な主張のために行うサイバー攻撃。]
      - [APT, 特定の組織を狙い、長い期間潜伏しながら情報を盗み続ける高度な攻撃。, {aka: [APT]}]
