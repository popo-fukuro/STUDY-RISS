id: ops
order: 12
domain: resp
color: "#8F4A12"
name: セキュリティ運用・監視
short: 運用・監視
priority: mid
badges: [new-weight]
summary: ログを集めて見張り、異常にいち早く気づくための日々の運用。脅威情報の活用、データを漏らさない仕組み、ITサービスの管理もここに入る。
themes:
  - 取得すべきログと、その保存・改ざん防止・時刻同期
  - SIEM・EDR・XDR・SOARの役割
  - SOCの運用と誤検知の減らし方
  - 脅威インテリジェンス（IoC、STIX／TAXII）
  - DLPなどのデータ保護
  - サービスマネジメント（SLA、変更管理）
keywords: [ログ, 時刻同期, SIEM, XDR, SOAR, SOC, IoC, STIX, TAXII, DLP, SLA]
examA2: SIEMなどの監視技術や、サービスマネジメント（○3）のSLA・変更管理などを問う。
examB: R6秋 問1でエンドポイントのログの調査と検知の仕組み、R6秋 問3でアクセスログから影響を受けた利用者を特定する問題が出た。
official:
  - {doc: シラバス Ver.2.1, where: 科目B 3-4 セキュリティ監視並びにログの取得及び分析}
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類15 サービスマネジメント（○3）}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類25「ログ管理・監視・検知及び対応」「脅威インテリジェンス」「脆弱性管理・データ保護」}
priorityReason: 直近の科目Bでは、R6秋 問1（どのログに何が残るかを考えて検知の仕組みを設計）とR6秋 問3（アクセスログから影響範囲を特定）がログを題材にしている。新制度の科目Bでは、大項目1に「セキュリティ運用状況の管理・点検」と「脅威インテリジェンスの活用」、大項目3に「データ保護」が加わった。試験要綱のサービスマネジメントは科目A-2で○3（重点ではない）。
textbook: ["5.10", "5.11"]
subs:
  - id: log
    name: ログ管理と時刻同期
    terms:
      - [ログの取得と保管, 何を、どの機器で、どれだけの期間記録するかを決め、安全に保存すること。, {aka: [ログの取得, ログの保管]}]
      - [ログの改ざん防止, ログを追記しかできない領域や別のサーバに保存し、攻撃者に消されないようにすること。, {aka: [改ざん防止], new: true}]
      - [時刻同期, 機器の時計をNTPなどでそろえ、複数のログを時系列で正しく突き合わせられるようにすること。]
      - [相関分析, 複数の機器のログを組み合わせ、単独では見えない攻撃の兆候を見つける分析。, {aka: [ログの相関分析]}]
  - id: detect
    name: 検知基盤
    terms:
      - [SIEM, さまざまな機器のログを集めて相関分析し、攻撃の兆候を知らせる仕組み。]
      - [XDR, 端末・ネットワーク・クラウドなどの検知情報をまとめて分析する仕組み。]
      - [NDR, ネットワークの通信を分析し、侵入された後の不審な動きを見つける仕組み。, {new: true}]
      - [SOAR, 決まった対応の手順を自動化し、多くの警報を効率よく処理する仕組み。]
      - [UEBA, 利用者や機器のふだんの行動を学習し、そこから外れた動きを見つける仕組み。]
  - id: soc
    name: SOCと運用サービス
    terms:
      - [SOC, 組織のネットワークや機器を監視し、攻撃を検知・分析する専門のチーム。]
      - [アラートトリアージ, 大量の警報を、重要度や本物らしさで仕分けし、対応の順番を決めること。, {new: true}]
      - [MSS／MDR, 監視や、検知・対応を外部の専門事業者に任せるサービス。, {aka: [MSS, MDR]}]
      - [脅威ハンティング, 警報を待たずに、侵入の痕跡が潜んでいないかを自分から探す活動。]
  - id: ti
    name: 脅威インテリジェンス
    terms:
      - [脅威インテリジェンス, 攻撃者や手口に関する情報を集めて分析し、防御に役立てる知見。]
      - [IoC, 侵害の痕跡を示す情報。不正な通信先のIPアドレスや、マルウェアのハッシュ値など。]
      - [STIX／TAXII, 脅威情報を構造化して書く形式（STIX）と、それを自動で交換する手順（TAXII）。, {aka: [STIX, TAXII]}]
      - [TLP, 共有した情報をどこまで広めてよいかを、色で示すルール。, {aka: [TLP, Traffic Light Protocol]}]
      - [OSINT, 公開されている情報源から集める情報や、その手法。]
  - id: data
    name: データ保護・DLP
    terms:
      - [DLP, 機密データの送信やコピーを監視し、外部への持出しを防ぐ仕組み。]
      - [データマスキング, データの一部を伏せ字などに置き換え、必要以上に見せないようにすること。]
      - [情報の削除, 記憶媒体を廃棄・再利用する前に、復元できない方法でデータを消すこと。, {aka: [情報の削除]}]
      - [Web分離, Webの閲覧を隔離した環境で行い、端末にマルウェアが届かないようにする仕組み。, {aka: [Web 分離, Web アイソレーション]}]
  - id: svc
    name: サービスマネジメント
    terms:
      - [SLA, サービスの提供者と利用者が、品質の目標（稼働率など）を取り決めた合意。]
      - [変更管理, システムの変更を記録・評価・承認してから行い、障害や不正な変更を防ぐ管理。]
      - [サービスデスク, 利用者からの問合せや障害の報告を一元的に受け付ける窓口。]
      - [可用性管理, 合意した稼働率を守るために、冗長化や保守の計画を管理すること。]
