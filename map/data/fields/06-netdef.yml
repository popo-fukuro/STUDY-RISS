id: netdef
order: 6
domain: infra
color: "#2A4F9E"
name: ネットワークセキュリティ・防御技術
short: ネットワーク防御
shortLines: [ネットワーク, 防御]
priority: high
badges: []
summary: 通信の出入口で攻撃を止め、通信を暗号化し、離れた場所からの接続を安全にする技術。ファイアウォール、IDS／IPS、WAF、VPN、メールやDNSの防御が中心。
themes:
  - ファイアウォール・IDS・IPS・WAFの役割分担
  - VPNの方式とリモートアクセスの安全
  - TLSの仕組みと古いバージョンの廃止
  - 送信ドメイン認証（SPF／DKIM／DMARC）
  - DNSSECとDoH／DoT
  - DDoS対策（CDN、スクラビング、レート制限）
keywords: [ファイアウォール, IDS, IPS, WAF, VPN, IPsec, TLS, SPF, DKIM, DMARC, DNSSEC, UTM]
examA2: 各防御装置の役割や、プロトコル（TLS、IPsec、DNSSEC）の動作を問う。
examB: R6秋 問2でDMARCの導入、R6春 問2でアノマリ型IPSとDDoS対策、R7秋 問3でVPNサービスの導入、R5秋 問2でファイアウォールのフィルタリング設定が題材になった。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類11 セキュリティ（◎4）・中分類10 ネットワーク（◎4）}
  - {doc: シラバス Ver.2.1, where: 科目B 3-5 ネットワーク及び機器のセキュリティ管理}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類25「6 技術的管理策（情報システムの適正利用の管理）」}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4、ネットワーク◎4）の両方にまたがる。直近の科目Bでは、R6秋 問2（DMARC・SPF・DKIM）、R6春 問2（IPSとDDoS対策）、R7秋 問3（VPNサービス）、R5秋 問2（ファイアウォールの設定・無線LAN）、R6春 問1（WAFの利点と課題）が防御技術を題材にしている。新制度のシラバス案では、ZTNAやDoH／DoTなどが用語例に明記された。
textbook: ["5.5", "5.6", "5.7", "5.8", "7.2", "7.3", "7.4", "7.5"]
subs:
  - id: perimeter
    name: 境界防御
    terms:
      - [ファイアウォール, 送信元・宛先・ポートなどのルールで、通してよい通信だけを通す装置。]
      - [ステートフルインスペクション, 通信のやり取りの状態を覚えておき、正しい応答のパケットだけを通す方式。, {aka: [ステートフルパケットフィルタ]}]
      - [DMZ, 外部に公開するサーバを置くための、内部ネットワークとは分けた区画。]
      - [UTM, ファイアウォール・IPS・マルウェア対策などを1台にまとめた装置。, {aka: [統合脅威管理]}]
  - id: detect
    name: 検知・防御装置
    terms:
      - [IDS, 不正な通信を見つけて知らせる仕組み。通信を止めはしない。]
      - [IPS, 不正な通信を見つけて遮断する仕組み。誤検知すると正常な通信まで止めてしまう。]
      - [シグネチャ型／アノマリ型, 既知の攻撃パターンと照合する方式と、ふだんと違う振る舞いを異常とみなす方式。, {aka: [シグネチャ型, アノマリ型]}]
      - [WAF, HTTPの中身を見て、Webアプリへの攻撃（SQLインジェクションなど）を止める装置。]
      - [偽陽性／偽陰性, 正常なものを攻撃と判断してしまうこと（フォールスポジティブ）と、攻撃を見逃すこと（フォールスネガティブ）。, {aka: [偽陽性, フォールスポジティブ]}]
  - id: vpn
    name: VPNとリモートアクセス
    terms:
      - [IPsec, IPの層で通信を暗号化・認証するプロトコル群（ESP、AH、IKE）。]
      - [TLS-VPN, TLSを使うVPN。ブラウザや専用ソフトで社内に接続する。SSL-VPNとも呼ぶ。, {aka: [SSL-VPN, TLS-VPN], sup: true}]
      - [ZTNA, 利用者と端末を毎回確かめ、許可したアプリにだけ接続させるリモートアクセスの方式。, {new: true}]
      - [VDI, 画面だけを手元の端末に送り、データは社内のサーバに残す仮想デスクトップ。]
      - [検疫ネットワーク, 社内につなぐ前に、端末のパッチやマルウェア対策の状態を確かめ、問題があれば隔離する仕組み。]
  - id: secure
    name: セキュア通信
    terms:
      - [TLS, 通信を暗号化し、サーバ証明書でサーバを確かめるプロトコル。現在はTLS 1.2と1.3を使い、SSLとTLS 1.0／1.1は廃止。]
      - [暗号スイート, TLSで使う鍵交換・暗号・ハッシュの組合せ。, {new: true}]
      - [STARTTLS, 平文で始めた通信を、途中からTLSに切り替える仕組み。メールの送受信で使う。]
      - [S/MIME, メールの本文や添付ファイルを、公開鍵で暗号化したり署名したりする方式。]
  - id: maildns
    name: メール・DNSの防御
    terms:
      - [SPF, 送信元のIPアドレスが、そのドメインの正規の送信サーバかをDNSで確かめる仕組み。]
      - [DKIM, 送信サーバがメールに電子署名を付け、受信側がDNSにある公開鍵で改ざんと送信ドメインを確かめる仕組み。]
      - [DMARC, SPF・DKIMの結果とFromのドメインの一致を見て、失敗したメールの扱い（none／quarantine／reject）を送信側が宣言する仕組み。]
      - [DNSSEC, DNSの応答に電子署名を付け、偽の応答を見破る仕組み。]
      - [DoH／DoT, DNSの問合せをHTTPSやTLSで暗号化し、盗み見を防ぐ方式。, {aka: [DoH, DoT]}]
  - id: ddos
    name: DDoS対策
    terms:
      - [スクラビングセンター, 大量の攻撃通信を引き受けて取り除き、正常な通信だけを届けるサービス。, {new: true}]
      - [レート制限, 一定時間あたりの要求回数に上限を設け、過剰なアクセスを抑える対策。, {new: true}]
