id: cloud
order: 8
domain: infra
color: "#1A6872"
name: クラウド・コンテナ・AI・IoT／制御システム
short: クラウド・AI・IoT
shortLines: [クラウド・, AI・IoT]
priority: high
badges: [new-weight]
summary: クラウドやコンテナ、生成AI、IoT機器や工場の制御システムなど、新しい基盤ならではの守り方。「だれがどこまで守るか」という分担を押さえるのが鍵になる。
themes:
  - 責任共有モデルとIaaS・PaaS・SaaSの違い
  - クラウドの設定ミスとアクセスキーの漏えい
  - コンテナとCI/CDパイプラインの安全
  - CASB・CSPM・SASEの役割
  - 生成AIの安全な利用（プロンプトインジェクション対策、RAGのアクセス制御）
  - 制御システムの安全（IEC 62443、ITとOTの分離）
keywords: [責任共有モデル, IaaS, SaaS, CASB, CSPM, SASE, コンテナ, IaC, プロンプトインジェクション対策, IEC 62443]
examA2: 責任共有モデル、CASBやSASEの役割、IoT・制御システムの規格などを問う。
examB: R5秋 問3でCIサービスとコンテナ、R6春 問3でクラウド上のWebサイト、R7春 問3でクラウドストレージのアクセスキー、R7秋 問4でSCADA（制御システム）が題材になった。
official:
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「5. セキュリティ実装技術」の(8)IoTシステムの設計・開発におけるセキュリティ}
  - {doc: シラバス Ver.2.1, where: 科目B 2-3（仮想化、コンテナ技術に関する知識）}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類26「クラウド・コンテナのセキュリティ」「IoT・制御システムのセキュリティ」「AIシステムを守るための対策」}
priorityReason: 直近の科目Bでは、R5秋 問3（CIサービスとコンテナ）、R6春 問3（クラウド上のWebサイト）、R7春 問3（クラウドストレージのアクセスキー）、R7秋 問4（SCADA）がこの分野の基盤を題材にしている。新制度では、科目B大項目2の製品・サービスの導入に「IoT、クラウドサービスを含む」と明記され、諸規程に「AIの安全な導入・利用」が加わり、シラバス案に「AIシステムを守るための対策（Security for AI）」の項目ができた。
textbook: ["1.5", "1.8"]
subs:
  - id: shared
    name: クラウドと責任共有
    terms:
      - [責任共有モデル, クラウド事業者と利用者が、どこまでを守るかを分担する考え方。IaaS・PaaS・SaaSで境目が変わる。]
      - [IaaS／PaaS／SaaS, 事業者が提供する範囲で分けたクラウドの種類。IaaSは基盤だけ、SaaSはアプリまで提供する。, {aka: [IaaS, SaaS, PaaS]}]
      - [クラウドの設定不備, ストレージの公開設定や過大な権限など、利用者側の設定ミス。情報漏えいの原因になる。, {new: true}]
      - [アクセスキー, プログラムからクラウドを操作するための認証情報。漏れると誰でもその権限で操作できてしまう。, {sup: true}]
      - [署名付きURL, 期限と権限を付けて、一時的にファイルへアクセスさせるURL。秘密の鍵を使うのでサーバ側で作る。, {sup: true}]
  - id: container
    name: 仮想化・コンテナ
    terms:
      - [仮想化, 1台の物理サーバの上で、複数の仮想マシンを動かす技術。]
      - [コンテナ, アプリと必要な部品をまとめ、OSのカーネルを共有して軽く動かす技術。]
      - [コンテナイメージの脆弱性管理, コンテナの元になるイメージに含まれる部品の脆弱性を、スキャンして管理すること。, {new: true}]
      - [IaC, サーバやネットワークの構成をコードで書き、自動で構築する手法。設定ミスをスキャンで見つけられる。]
      - [CI/CDパイプライン, コードの変更を自動でビルド・テスト・配備する仕組み。乗っ取られると不正なコードが配られる。, {aka: [CI/CD], new: true}]
  - id: protect
    name: SASE・クラウド保護
    terms:
      - [CASB, 従業員のクラウド利用を見える化し、許可しないサービスの利用やデータの持出しを制御する仕組み。]
      - [CSPM, クラウドの設定を継続的に点検し、危険な設定ミスを見つける仕組み。]
      - [CWPP, クラウド上の仮想マシンやコンテナなど、動いている処理そのものを守る仕組み。]
      - [SASE, ネットワーク機能とセキュリティ機能をまとめて、クラウドから提供する考え方。]
      - [インスタンスメタデータサービスの保護, 仮想マシンから認証情報を取り出せる仕組みを、SSRFなどで悪用されないように守ること。, {new: true}]
  - id: ai
    name: AIのセキュリティ
    terms:
      - [プロンプトインジェクション対策, 指示と外部データを分ける、AIエージェントの権限を絞るなどして、不正な命令の実行を防ぐ対策。, {new: true}]
      - [RAGのアクセス制御, 生成AIが参照する社内データに、利用者の権限に応じた参照制限をかけること。, {aka: [RAG], new: true}]
      - [OWASP Top 10 for LLM Applications, 大規模言語モデルを使うアプリの主なリスクをまとめた一覧。, {new: true}]
      - [AI事業者ガイドライン, AIを開発・提供・利用する事業者が取り組むべきことをまとめた国のガイドライン。, {new: true}]
  - id: iot
    name: IoT・制御システム
    terms:
      - [制御システム（SCADA）, 工場・プラント・電力などの設備を監視・制御するシステム。止まると物理的な被害につながる。, {aka: [制御システム, SCADA]}]
      - [IEC 62443, 産業用の制御システムのセキュリティに関する国際規格群。]
      - [IT／OT境界のDMZ, 情報システム（IT）と制御システム（OT）の間に緩衝区画を置き、直接の通信を防ぐ構成。, {aka: [IT／OT 境界の DMZ], new: true}]
      - [一方向ゲートウェイ, 物理的に一方向にしかデータを流せない装置。制御システム側への侵入を防ぐ。, {new: true}]
      - [JC-STAR, IoT製品がセキュリティ要件を満たすかを評価し、ラベルを付ける国の制度。, {new: true}]
