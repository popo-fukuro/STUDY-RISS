id: threats
order: 2
domain: base
color: "#A3333A"
name: サイバー攻撃・脅威・脆弱性
short: 脅威・攻撃手法
shortLines: [脅威・, 攻撃手法]
priority: high
badges: [new-weight]
summary: 攻撃者が「どこから入り、何をして、どう広がるか」を知る分野。攻撃の手口がわかると、守る側の対策の意味がはっきりする。
themes:
  - サイバーキルチェーンやMITRE ATT&CKで攻撃の流れをつかむ
  - ランサムウェアと二重恐喝
  - クレデンシャルスタッフィング・MFA疲労攻撃などの認証への攻撃
  - DDoS攻撃・リフレクション攻撃
  - 標的型攻撃メール・ビジネスメール詐欺
  - AIを悪用した攻撃とAIシステムへの攻撃（新制度のシラバス案で追加）
keywords: [サイバーキルチェーン, MITRE ATT&CK, ラテラルムーブメント, C2サーバ, ランサムウェア, クレデンシャルスタッフィング, DDoS攻撃, プロンプトインジェクション]
examA2: 攻撃手法の名前と仕組みの対応（例：どの攻撃の説明か）を選ぶ問題として出る。
examB: ログや通信の記録から攻撃者の行動を読み解く設問の前提になる（R6秋 問1：エンドポイントのログ、R5秋 問3：CIサービスを経由した攻撃の流れ、R7秋 問4：攻撃シナリオの検討）。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目A-2 中分類11 セキュリティ（◎4）}
  - {doc: シラバス追補版 Ver.4.0, where: 中分類11「1. 情報セキュリティ」の(3)脅威・(7)攻撃手法}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類23 情報セキュリティの脅威}
priorityReason: 試験要綱の科目A-2重点分野（セキュリティ◎4）の中心。直近の科目Bでは、R6秋 問1（エンドポイントのログから攻撃を推測）、R5秋 問3（CIサービスを経由した攻撃の流れ）、R7秋 問4（攻撃シナリオの検討）が攻撃の流れを題材にしている。新制度のシラバス案では中分類23として独立し、AIを悪用した攻撃・AIシステムに対する攻撃・サプライチェーンを狙った攻撃が用語例に加わった。
textbook: ["2.1", "2.2", "2.4", "2.7", "2.9"]
subs:
  - id: lifecycle
    name: 攻撃のライフサイクル
    terms:
      - [サイバーキルチェーン, 偵察から目的の達成まで、攻撃を段階に分けて捉えるモデル。どの段階で止めるかを考えるのに使う。]
      - [MITRE ATT&CK, 実際の攻撃で観測された戦術・技術を体系的にまとめた知識ベース。, {aka: [ATT&CK]}]
      - [権限昇格, 一般利用者の権限から、管理者権限などを不正に手に入れること。]
      - [ラテラルムーブメント, 侵入した端末から、社内の別の端末やサーバへ横に広がっていくこと。]
      - [C2サーバ, 感染した端末に命令を送り、盗んだ情報を受け取る攻撃者のサーバ。C&Cサーバとも呼ぶ。, {aka: [C2, C&C]}]
  - id: malware
    name: マルウェア
    terms:
      - [ランサムウェア, データを暗号化して使えなくし、元に戻す代わりに身代金を要求するマルウェア。]
      - [二重恐喝（多重恐喝）, 暗号化に加えて「盗んだデータを公開する」と脅し、支払いを迫る手口。, {aka: [二重恐喝], new: true}]
      - [RaaS, ランサムウェアを攻撃者に貸し出し、成功報酬を分け合うビジネス形態。]
      - [ファイルレスマルウェア, 実行ファイルをディスクに残さず、メモリ上やOSの標準ツールを使って動くマルウェア。]
  - id: authattack
    name: 認証・セッションへの攻撃
    terms:
      - [ブルートフォース攻撃, パスワードを総当たりで試す攻撃。ログイン失敗が続いたらロックする対策が基本。]
      - [リバースブルートフォース攻撃, よく使われるパスワードを固定し、IDのほうを次々に変えて試す攻撃。アカウントロックがかかりにくい。]
      - [クレデンシャルスタッフィング, 別のサイトから漏れたIDとパスワードの組を使い回してログインを試す攻撃。]
      - [MFA疲労攻撃, 多要素認証の承認通知を大量に送りつけ、利用者が根負けして承認するのを狙う攻撃。, {new: true}]
      - [レインボーテーブル攻撃, ハッシュ値と元のパスワードの対応表を使い、ハッシュ値から素早くパスワードを割り出す攻撃。]
  - id: dos
    name: DoS・ネットワーク攻撃
    terms:
      - [DDoS攻撃, 多数の機器から大量の通信を送りつけ、サービスを止める攻撃。]
      - [リフレクション攻撃（DNSアンプ攻撃）, 送信元を標的に偽った小さな問合せで、第三者のサーバから大きな応答を標的に送らせる攻撃。, {aka: [リフレクション攻撃, DNSアンプ]}]
      - [ポートスキャン, どのポートが開いているかを調べ、攻撃の入口を探す偵察行為。]
      - [DNSキャッシュポイズニング, キャッシュDNSサーバに偽の応答を覚えさせ、利用者を偽サイトへ誘導する攻撃。]
  - id: social
    name: 人をだます攻撃
    terms:
      - [ソーシャルエンジニアリング, 技術ではなく人の心理のすきを突いて、パスワードなどを聞き出す手口。]
      - [標的型攻撃メール, 特定の組織あてに、業務を装ったメールで添付ファイルやリンクを開かせる攻撃。, {aka: [標的型攻撃]}]
      - [ビジネスメール詐欺（BEC）, 取引先や経営者になりすましたメールで、偽の口座へ送金させる詐欺。, {aka: [ビジネスメール詐欺, BEC]}]
      - [フィッシング, 本物そっくりの偽サイトに誘導し、IDやカード番号を入力させる手口。]
  - id: advanced
    name: AIと高度な攻撃
    terms:
      - [プロンプトインジェクション, 生成AIへの入力や参照データに命令文を紛れ込ませ、開発者の意図しない動作をさせる攻撃。]
      - [データポイズニング, AIの学習データに不正なデータを混ぜ、判断をゆがめる攻撃。]
      - [ディープフェイク, AIで作った偽の映像や音声。経営者になりすました送金指示などに悪用される。]
      - [ソフトウェアサプライチェーン攻撃, 正規ソフトの更新配信や部品（ライブラリ）を汚染し、利用者全体に被害を広げる攻撃。, {new: true}]
