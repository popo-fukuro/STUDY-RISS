id: risk
order: 14
domain: mgmt
color: "#435789"
name: リスクマネジメント
short: リスクマネジメント
shortLines: [リスク, マネジメント]
priority: high
badges: [new-weight]
summary: 守るべきものを洗い出し、どんなリスクがどれくらいあるかを評価して、対策を選ぶ考え方。委託先や取引先を含めた、サプライチェーン全体のリスクも扱う。
themes:
  - 情報資産台帳と重要度の評価
  - リスクの特定・分析・評価の流れ
  - リスク対応の4つの選択肢と残留リスク
  - 定量的分析（ALE）と定性的分析
  - 脅威分析（STRIDE、アタックツリー）と攻撃シナリオ
  - サプライチェーン・委託先のリスク
keywords: [情報資産台帳, リスクアセスメント, リスク基準, リスク回避, リスク低減, リスク移転, リスク保有, 残留リスク, ALE, STRIDE, サプライチェーンリスク]
examA2: リスクアセスメントの手順や、リスク対応の選択肢、ALEの計算などを問う。
examB: R5秋 問4で業務委託先を含むリスクアセスメント、R7春 問1でサプライチェーンリスク対策、R7秋 問4でサプライチェーンの中の企業の攻撃シナリオと対策が題材になった。新制度のサンプル問1も情報資産台帳を題材にしている。
official:
  - {doc: 試験要綱 Ver.5.6, where: 科目B 大項目1 情報セキュリティマネジメントの推進又は支援}
  - {doc: シラバス Ver.2.1, where: 科目B 1-2 リスクアセスメント、1-3 リスク対応、3-10 サプライチェーン}
  - {doc: シラバス案 Ver.0.1（新制度）, where: 中分類24「2 リスクマネジメント」}
priorityReason: 科目Bの出題範囲の大項目1（マネジメント）の中心。直近の科目Bでは、R5秋 問4（リスクアセスメント）、R7春 問1（サプライチェーンリスク対策）、R7秋 問4（サプライチェーンの中の企業の管理体制と攻撃シナリオ）が題材にしている。新制度では科目Bで「マネジメント分野の強化」がうたわれ、サプライチェーンが大項目1に移り、サンプル問1が情報資産台帳を題材にしている。
textbook: ["4.1", "4.2"]
subs:
  - id: asset
    name: 情報資産の把握
    terms:
      - [情報資産台帳, 守る対象の情報資産を、管理部署・重要度・保存期限などとともに一覧にしたもの。]
      - [重要度の評価, 機密性・完全性・可用性の評価値から、情報資産の重要さを決めること。, {sup: true}]
      - [リスク所有者, そのリスクを管理する責任と権限を持つ人。]
  - id: assess
    name: リスクアセスメント
    terms:
      - [リスクアセスメント, リスクを特定し、分析し、評価するまでの一連の流れ。]
      - [リスク基準, どの大きさのリスクなら受け入れるかなど、評価の物差しとなる基準。]
      - [定量的／定性的リスク分析, 金額などの数値で表す分析と、大・中・小などの段階で表す分析。, {aka: [リスクの定量的分析, リスクの定性的分析]}]
      - [年間予想損失額（ALE）, 1回あたりの損失額（SLE）×1年あたりの発生回数（ARO）で求める、1年分の損失の見込み。, {aka: [年間予想損失額, ALE]}]
      - [リスク分析のアプローチ, ベースライン・非形式的・詳細・組合せの4つのやり方。組合せアプローチは重要な資産だけを詳しく分析する。, {aka: [ベースラインアプローチ, 組合せアプローチ], new: true}]
  - id: treat
    name: リスク対応
    terms:
      - [リスク低減, 対策を講じて、起きる可能性や影響を小さくすること。]
      - [リスク回避, リスクの原因となる業務やサービスそのものをやめること。]
      - [リスク移転（共有）, 保険や委託の契約で、損失の負担をほかの組織と分け合うこと。, {aka: [リスク移転, リスク共有]}]
      - [リスク保有（受容）, 小さなリスクを、対策をせずに受け入れること。, {aka: [リスク保有, リスク受容]}]
      - [残留リスク, 対策を講じた後にも残るリスク。経営者が承知して受け入れる必要がある。]
      - [サイバー保険, サイバー攻撃による損害や対応の費用を補償する保険。リスク移転の手段。]
  - id: threatmodel
    name: 脅威分析の手法
    terms:
      - [STRIDE, なりすまし・改ざん・否認・情報漏えい・サービス妨害・権限昇格の6分類で脅威を洗い出す手法。]
      - [アタックツリー分析, 攻撃の目的を頂点に置き、達成する手段を木の枝のように分解して分析する手法。, {aka: [アタックツリー]}]
      - [攻撃シナリオ, 攻撃者がどこから入り、どう進み、何を狙うかを具体的に描いたもの。, {aka: [脅威シナリオ, 攻撃シナリオ], new: true}]
  - id: supply
    name: サプライチェーンと委託
    terms:
      - [サプライチェーンリスク, 取引先や委託先、使っている製品・サービスを経由して被害を受けるリスク。]
      - [委託先管理, 委託先に求めるセキュリティの要件を契約で定め、守られているかを確かめること。, {aka: [委託先, 供給者関係]}]
      - [SCS評価制度, サプライチェーンを強くするため、企業のセキュリティ対策の水準を評価する国の制度。, {aka: [SCS 評価制度, SCS], new: true}]
      - [再委託の管理, 委託先がさらに別の会社へ仕事を出す場合の、承認や管理のルール。, {sup: true}]
