# 関係タブに載せる比較表

cloudCompare:
  title: クラウドと従来型インフラのセキュリティの違い
  columns: [観点, 従来型（オンプレミス）, クラウド, 試験での着眼点]
  rows:
    - [守る境界, 社内ネットワークの外周。ファイアウォールやDMZで内と外を分ける, IDとAPIが境界になる。ネットワークの内か外かより「だれが・何に」アクセスするかが中心, 境界型防御とゼロトラストの違い]
    - [責任の範囲, 建物・機器からアプリまで、すべて自組織の責任, 責任共有モデルで分担する。IaaS・PaaS・SaaSで境目が変わるが、データとアカウントは常に利用者の責任, どこまでが利用者の責任か]
    - [典型的なリスク, 侵入後の社内での横展開、パッチの適用漏れ、機器の故障や災害, 設定不備（公開設定・過大な権限）、アクセスキーの漏えい、事業者側の障害、シャドーIT, R7春 問3（アクセスキーの不正利用）]
    - [アクセス制御, ディレクトリサービスとファイアウォールのルール、ネットワークの区画, クラウドのID・権限のポリシー、IDaaSによるSSOと多要素認証、条件付きのアクセス, 最小権限のポリシー設計]
    - [リモートアクセス, VPNで社内ネットワークに入れてから使わせる, ZTNAやSASEで、アプリごとに毎回確かめて接続させる, R7秋 問3（VPNサービスの導入）]
    - [監視とログ, 自社の機器のログをsyslogやSIEMに集める, 事業者が用意する操作ログを自分で有効にし、保存期間や範囲を設定する。設定の不備はCSPMで監視する, どのログが取れるか・だれが持っているか]
    - [評価と調達, 機器やソフトを自分で選び、検査や脆弱性診断を行う, 第三者認証（ISMAP、ISO/IEC 27017など）や事業者の報告書で評価し、契約やSLAで責任を明確にする。診断に事前の申請が要る場合もある, ISMAP・SLA・契約]
    - [データと鍵, 自社の媒体に保存し、暗号化や廃棄も自分で行う, 事業者の基盤に保存する。KMSや利用者が管理する鍵で暗号化し、削除の方法を確かめておく, 鍵をだれが管理するか]

pairs:
  title: 似た概念の見分け方
  items:
    - id: p-authn-authz
      title: 認証／認可
      items:
        - [認証, 相手が本人かを確かめる（あなたは誰？）]
        - [認可, 確かめた相手に何を許すかを決める（何をしてよい？）]
      point: 順番は「認証 → 認可」。OAuth 2.0は認可の仕組みで、本人確認まで行うのはOpenID Connect。
      fields: [auth]
    - id: p-hash-mac-sig
      title: ハッシュ／MAC／デジタル署名
      items:
        - [ハッシュ, 鍵を使わない。改ざんの検知はできるが、作り直されると見抜けない]
        - [MAC, 共通鍵を使う。改ざん検知と、鍵を持つ相手が作ったことの確認ができる]
        - [デジタル署名, 秘密鍵で署名し公開鍵で検証。改ざん検知に加えて否認防止までできる]
      point: 「鍵なし → 共通鍵 → 公開鍵」の順にできることが増える。否認防止ができるのは署名だけ。
      fields: [crypto]
    - id: p-fw-ids-ips-waf
      title: FW／IDS／IPS／WAF
      items:
        - [FW, IPアドレスやポートで通信を通す・止める]
        - [IDS, 不正な通信を見つけて知らせる（止めない）]
        - [IPS, 不正な通信を見つけて止める]
        - [WAF, HTTPの中身を見て、Webアプリへの攻撃を止める]
      point: 見ている層と「止めるか」で分ける。SQLインジェクションの文字列を見て止めるのはWAF。
      fields: [netdef]
    - id: p-spf-dkim-dmarc
      title: SPF／DKIM／DMARC
      items:
        - [SPF, 送信元のIPアドレスが正規の送信サーバかをDNSで確かめる]
        - [DKIM, メールの電子署名を、DNSの公開鍵で確かめる]
        - [DMARC, SPF・DKIMの結果とFromのドメインの一致を見て、失敗時の扱いを送信側が宣言する]
      point: SPFは「どこから送ったか」、DKIMは「改ざんされていないか」、DMARCはその2つを束ねる方針。転送ではSPFが失敗しやすい。
      fields: [netdef]
    - id: p-dnssec-doh
      title: DNSSEC／DoH・DoT
      items:
        - [DNSSEC, 応答に署名を付けて「本物か（改ざんされていないか）」を確かめる]
        - [DoH・DoT, 問合せと応答を暗号化して「盗み見」を防ぐ]
      point: DNSSECは完全性、DoH・DoTは機密性。DNSSECは中身を暗号化しない。
      fields: [netdef, netbase]
    - id: p-cve-cwe-cvss
      title: CVE／CWE／CVSS
      items:
        - [CVE, 個々の脆弱性に付ける識別番号]
        - [CWE, 脆弱性の種類の分類]
        - [CVSS, 脆弱性の深刻度を表す点数]
      point: 「どの脆弱性か（CVE）」「どんな種類か（CWE）」「どれくらい深刻か（CVSS）」。
      fields: [vuln]
    - id: p-cvss-epss-kev
      title: CVSS／EPSS／KEV
      items:
        - [CVSS, 脆弱性そのものの深刻度]
        - [EPSS, 近いうちに悪用される確率の見積り]
        - [KEV, 実際に悪用が確認された脆弱性のカタログ]
      point: CVSSが高くても悪用されていないものはある。優先度は深刻度に、悪用の可能性や実績を組み合わせて決める。
      fields: [vuln]
    - id: p-diag-pentest
      title: 脆弱性診断／ペネトレーションテスト
      items:
        - [脆弱性診断, 既知の種類の脆弱性を、ツールと手作業で網羅的に洗い出す]
        - [ペネトレーションテスト, 攻撃者の目線で侵入を試み、目的を達成できるかを確かめる]
      point: 診断は「広く網羅」、ペンテストは「目的に向けて深く」。
      fields: [vuln]
    - id: p-sast-dast-sca
      title: SAST／DAST／IAST／SCA
      items:
        - [SAST, ソースコードを動かさずに解析する]
        - [DAST, 動いているアプリに外から入力して調べる]
        - [IAST, アプリの内部に仕組みを入れ、動かしながら調べる]
        - [SCA, 使っているOSSなどの部品とその既知の脆弱性を調べる]
      point: 自分が書いたコードを見るのがSAST・DAST・IAST、他人が作った部品を見るのがSCA。
      fields: [devproc]
    - id: p-csirt-psirt-soc
      title: CSIRT／PSIRT／SOC
      items:
        - [CSIRT, 組織で起きたインシデントに対応する]
        - [PSIRT, 自社製品の脆弱性に対応する]
        - [SOC, 監視して攻撃を検知・分析する]
      point: SOCが見つけ、CSIRTが対応する。PSIRTは「製品」が対象。
      fields: [incident, ops]
    - id: p-rto-rpo
      title: RTO／RPO
      items:
        - [RTO, どれだけの時間で復旧するかの目標]
        - [RPO, どの時点までのデータを取り戻すかの目標]
      point: RTOは「時間（いつまでに直すか）」、RPOは「データ（どこまで戻るか）」。RPOを小さくするにはバックアップを頻繁に取る。
      fields: [incident]
    - id: p-acmodels
      title: DAC／MAC／RBAC／ABAC
      items:
        - [DAC, 所有者が自由に権限を与える]
        - [MAC, システムが決めたラベルで強制する]
        - [RBAC, 役割に権限を付ける]
        - [ABAC, 属性の組合せのルールで決める]
      point: 「だれが決めるか（所有者かシステムか）」と「何に権限を付けるか（役割か属性か）」で区別する。
      fields: [auth]
    - id: p-sym-pub
      title: 共通鍵暗号／公開鍵暗号
      items:
        - [共通鍵暗号, 暗号化と復号に同じ鍵を使う。速いが、鍵を安全に渡すのが難しい]
        - [公開鍵暗号, 公開鍵で暗号化し秘密鍵で復号する。鍵を渡しやすいが遅い]
      point: 実際の通信では両方を組み合わせる（ハイブリッド暗号）。
      fields: [crypto]
    - id: p-oauth-oidc-saml
      title: OAuth 2.0／OpenID Connect／SAML
      items:
        - [OAuth 2.0, アクセス権を委ねる（認可）。アクセストークンを使う]
        - [OpenID Connect, OAuth 2.0に本人確認を加えた認証。IDトークン（JWT）を使う]
        - [SAML, XMLのアサーションで認証結果を渡す。主に企業向けSSO]
      point: 「認可だけ」がOAuth、「認証もする」のがOIDCとSAML。
      fields: [auth]
    - id: p-xss-csrf
      title: XSS／CSRF
      items:
        - [XSS, 攻撃者のスクリプトが、利用者のブラウザで正規サイトとして動く]
        - [CSRF, 利用者のブラウザから、正規サイトに意図しないリクエストを送らせる]
      point: XSSは「スクリプトを動かす」、CSRFは「リクエストを送らせる」。XSSが動くとCSRFトークンも盗めてしまう。
      fields: [web]
    - id: p-xss-types
      title: 反射型／格納型／DOM型XSS
      items:
        - [反射型, リクエストに含めたスクリプトが、そのまま応答に返る]
        - [格納型, サーバに保存されたスクリプトが、見た人全員のページに出る]
        - [DOM型, サーバを通らず、ブラウザ側のJavaScriptの処理だけで起きる]
      point: どこで（サーバかブラウザか）、いつ（その場か保存後か）埋め込まれるかで区別する。
      fields: [web]
    - id: p-hijack-fixation
      title: セッションハイジャック／セッションフィクセーション
      items:
        - [セッションハイジャック, 利用者のセッションIDを後から盗む]
        - [セッションフィクセーション, 攻撃者が用意したIDを先に使わせておく]
      point: ハイジャックは「盗む」、フィクセーションは「先に押しつける」。フィクセーションはログイン時にIDを作り直して防ぐ。
      fields: [web]
    - id: p-smime-starttls
      title: S/MIME／STARTTLS
      items:
        - [S/MIME, メールの本文や添付ファイルそのものを暗号化・署名する（送信者から受信者まで）]
        - [STARTTLS, サーバ間などの通信路をTLSで暗号化する（区間ごと）]
      point: S/MIMEは「中身」、STARTTLSは「通り道」。S/MIMEはSMTPの通信を暗号化する方式ではない。
      fields: [netdef]
    - id: p-sig-anomaly
      title: シグネチャ型／アノマリ型
      items:
        - [シグネチャ型, 既知の攻撃パターンと照合する。誤検知は少ないが未知の攻撃に弱い]
        - [アノマリ型, ふだんの状態から外れたものを異常とする。未知の攻撃も見つけられるが誤検知が増えやすい]
      point: しきい値を厳しくすると見逃し（偽陰性）が減る代わりに、誤検知（偽陽性）が増える。
      fields: [netdef]
    - id: p-edr-ndr-xdr
      title: EDR／NDR／XDR／SIEM／SOAR
      items:
        - [EDR, 端末を見張る]
        - [NDR, ネットワークを見張る]
        - [XDR, 端末・ネットワーク・クラウドの検知をまとめて分析する]
        - [SIEM, いろいろな機器のログを集めて相関分析する]
        - [SOAR, 対応の手順を自動化する]
      point: 「どこを見るか」がEDR・NDR・XDR、「集めて分析する」のがSIEM、「動かす（自動対応）」のがSOAR。
      fields: [ops, osdb]
    - id: p-risk-treat
      title: リスク回避／低減／移転／保有
      items:
        - [回避, 原因となる業務そのものをやめる]
        - [低減, 対策で可能性や影響を小さくする]
        - [移転, 保険や委託で負担を分け合う]
        - [保有, 対策せずに受け入れる]
      point: 「やめる・減らす・渡す・受け入れる」。サイバー保険の加入は移転。
      fields: [risk]
    - id: p-event-incident
      title: 情報セキュリティ事象／インシデント
      items:
        - [事象, セキュリティに関係がありそうな出来事すべて]
        - [インシデント, 事象のうち、事業に悪い影響を与える（おそれがある）もの]
      point: すべての事象がインシデントではない。インシデントかどうかを判断して、優先順位を付ける（トリアージ）。
      fields: [incident]
    - id: p-three-mac
      title: 3つの「MAC」
      items:
        - [メッセージ認証符号, 改ざんを検知するための値（暗号技術）]
        - [強制アクセス制御, システムが決めたラベルで権限を強制する方式（アクセス制御）]
        - [MACアドレス, ネットワーク機器に付いている物理的な番号（ネットワーク）]
      point: 同じ略語でも分野が違う。問題文の文脈で見分ける。
      fields: [crypto, auth, netbase]
