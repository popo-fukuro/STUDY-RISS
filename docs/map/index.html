/* 分野色を背景の上に線として引くときの色（ダークでは少し明るく） */
:root { --mix-line: 0%; }
:root[data-theme="dark"] { --mix-line: 38%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mix-line: 38%; } }

/* ===== 基本 ===== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.7;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--surface-2); padding: 6px 12px; border-radius: 8px; }
.skip:focus { top: 8px; }
[hidden] { display: none !important; }

/* ===== 上部バー ===== */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: var(--topbar-h);
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--center) 0 38%, transparent 39% 52%, var(--center) 53% 58%, transparent 59%),
              conic-gradient(var(--d-base) 0 60deg, var(--d-cryptoauth) 0 120deg, var(--d-infra) 0 180deg, var(--d-dev) 0 240deg, var(--d-resp) 0 300deg, var(--d-mgmt) 0);
}
.brand-title { font-family: var(--font-display); font-size: 18px; line-height: 1.2; letter-spacing: .02em; white-space: nowrap; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tabs a {
  text-decoration: none; color: var(--ink-2); padding: 7px 12px; border-radius: 999px;
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.tabs a:hover { background: var(--bg-2); }
.tabs a[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tabs .ts { display: none; }
.panel-title:focus { outline: none; }
.search { position: relative; margin-left: auto; width: min(320px, 32vw); }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); font: inherit;
}
.search::before {
  content: ""; position: absolute; left: 13px; top: 12px; width: 10px; height: 10px;
  border: 2px solid var(--ink-3); border-radius: 50%; pointer-events: none;
}
.search::after {
  content: ""; position: absolute; left: 24px; top: 23px; width: 6px; height: 2px;
  background: var(--ink-3); transform: rotate(45deg); pointer-events: none;
}
.search ul {
  position: absolute; right: 0; top: 44px; width: min(440px, 92vw); max-height: 60vh; overflow: auto;
  margin: 0; padding: 6px; list-style: none; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.search li { padding: 8px 10px; border-radius: 8px; cursor: pointer; line-height: 1.45; }
.search li[aria-selected="true"], .search li:hover { background: var(--bg-2); }
.search li .q-name { font-weight: 700; }
.search li .q-path { display: block; font-size: 12px; color: var(--ink-3); }
.search li.q-info { cursor: default; font-size: 12px; color: var(--ink-3); }
.search li.q-info:hover { background: none; }
.icon-btn {
  flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2);
  background: var(--surface-2); cursor: pointer; font-size: 17px; line-height: 1;
}

main { flex: 1; min-height: 0; position: relative; }
.links-layout > *, .tables > *, .two-col > *, .exam-wrap section, .fsec-body > * { min-width: 0; }
.view { position: absolute; inset: 0; overflow: auto; }

/* ===== 地図 ===== */
#view-map { overflow: hidden; }
#map-wrap {
  position: absolute; inset: 0; touch-action: none; cursor: grab;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 60%, color-mix(in srgb, var(--bg-2) 70%, transparent) 100%),
    var(--bg);
}
#map-wrap.dragging { cursor: grabbing; }
#map { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#map text { font-family: var(--font-ui); }

.ring { fill: none; stroke: var(--grid); stroke-width: 1.4; opacity: .55; }
.ring.dash { stroke-dasharray: 6 10; }
.tick { stroke: var(--grid); stroke-width: 2; opacity: .7; }
.tick.major { stroke-width: 4; opacity: .9; }
.tick-label { fill: var(--ink-3); font-size: 22px; letter-spacing: .08em; }
.sector { fill: var(--c); opacity: var(--sector-op); }
.sector-edge { stroke: var(--c); stroke-width: 3; opacity: .35; fill: none; }
.domain-label { fill: var(--c); font-family: var(--font-display) !important; font-size: 46px; letter-spacing: .28em; }
:root[data-theme="dark"] .domain-label { fill: color-mix(in srgb, var(--c) 55%, white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .domain-label { fill: color-mix(in srgb, var(--c) 55%, white); } }

.trunk { fill: none; stroke: color-mix(in srgb, var(--c), white var(--mix-line)); stroke-width: 18; stroke-linecap: round; opacity: var(--trunk-op); transition: opacity var(--ease); }
.center-disc { fill: var(--center); stroke: var(--center-ring); stroke-width: 6; }
.center-ring2 { fill: none; stroke: var(--center); stroke-width: 2; opacity: .5; }
.center-title { fill: #FFFFFF; font-family: var(--font-display) !important; font-size: 50px; text-anchor: middle; }
.center-sub { fill: #C9D7E6; font-size: 22px; text-anchor: middle; letter-spacing: .2em; }

/* 関係の矢印 */
.rel { cursor: pointer; transition: opacity var(--ease); }
.rel-line { fill: none; stroke: var(--link-line); stroke-width: 4; opacity: .5; }
.rel.core .rel-line { stroke-width: 9; opacity: .72; }
.rel:not(.core) .rel-line { stroke-dasharray: 16 12; }
.rel-head { fill: var(--link-line); opacity: .65; }
.rel.core .rel-head { opacity: .8; }
.rel-hit { fill: none; stroke: transparent; stroke-width: 34; }
.rel-label { display: none; pointer-events: none; }
.rel-label rect { fill: var(--surface-2); stroke: var(--link-on); stroke-width: 2.5; }
.rel-label text { fill: var(--ink); font-size: 24px; font-weight: 700; text-anchor: middle; }
.labels-on .rel-label { display: inline; }
.rel.on .rel-label, .rel:hover .rel-label, .rel:focus-visible .rel-label { display: inline; }
.rel.on .rel-line, .rel:hover .rel-line, .rel:focus-visible .rel-line { stroke: var(--link-on); opacity: 1; }
.rel.on .rel-head, .rel:hover .rel-head, .rel:focus-visible .rel-head { fill: var(--link-on); opacity: 1; }
.rel:focus-visible { outline: none; }
.rel:focus-visible .rel-line { stroke-width: 12; }
.no-links .rel { display: none; }
.core-only .rel:not(.core) { display: none; }

/* 大分類カード */
.card { cursor: pointer; transition: opacity var(--ease); }
.card:focus { outline: none; }
.card-bg { fill: var(--card-bg); stroke: color-mix(in srgb, var(--c) 45%, var(--line)); stroke-width: 2; }
.card-band, .card-band-sq { fill: var(--c); }
.card-short { fill: #FFFFFF; font-weight: 700; font-size: 27px; text-anchor: middle; }
.sub-sq { fill: var(--c); opacity: .85; }
.sub-name { fill: var(--card-ink); font-size: 20px; }
.card-foot-sep { stroke: var(--line); stroke-width: 1.5; }
.pill-bg.high { fill: var(--pill-high-bg); }
.pill-bg.mid { fill: var(--pill-mid-bg); }
.pill-bg.low { fill: var(--pill-low-bg); }
.pill-text { font-size: 18px; font-weight: 700; text-anchor: middle; }
.pill-text.high { fill: var(--pill-high-ink); }
.pill-text.mid { fill: var(--pill-mid-ink); }
.pill-text.low { fill: var(--pill-low-ink); }
.card-open { fill: var(--accent); font-size: 17px; font-weight: 700; text-anchor: end; }
.card-weight { fill: var(--badge-weight-ink); font-size: 15px; font-weight: 700; }
.card-weight-bg { fill: var(--badge-weight-bg); }
.card-compact-bg { fill: var(--c); stroke: color-mix(in srgb, var(--c) 70%, black); stroke-width: 2; }
.card-big { fill: #FFFFFF; font-family: var(--font-display) !important; text-anchor: middle; }
.card-ring { fill: none; stroke: transparent; stroke-width: 10; }
.card:focus-visible .card-ring { stroke: var(--accent); }
.card.hit .card-ring { stroke: var(--hit); stroke-dasharray: 22 10; }
.card.is-focus .card-ring { stroke: var(--ink); }
.lod-detail-only { display: none; }
.lod-detail .lod-detail-only { display: inline; }
.lod-detail .lod-compact-only { display: none; }

.focusing .card.is-dim, .focusing .rel.is-dim, .focusing .trunk.is-dim { opacity: .18; }
.focusing .trunk.is-on { opacity: .95; }

/* 操作ボタン */
.zoom-ctl {
  position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 5;
}
.zoom-ctl button {
  width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface-2); cursor: pointer; font-size: 22px; font-weight: 700; box-shadow: var(--shadow);
}
.zoom-ctl button.fit { font-size: 13px; }

/* 左上パネル */
.legend-panel {
  position: absolute; left: 16px; top: 16px; width: 290px; max-height: calc(100% - 32px); overflow: auto;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); z-index: 5; font-size: 13px; line-height: 1.6;
}
.legend-panel > summary {
  cursor: pointer; padding: 10px 14px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px;
}
.legend-panel > summary::-webkit-details-marker { display: none; }
.legend-panel > summary::before { content: "▸"; transition: transform var(--ease); }
.legend-panel[open] > summary::before { transform: rotate(90deg); }
.legend-body { padding: 0 14px 12px; }
.legend-body h3 { font-size: 12.5px; margin: 10px 0 4px; color: var(--ink-2); letter-spacing: .06em; }
.legend-body ol { margin: 0; padding-left: 1.3em; }
.legend-body label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; }
.legend-body input { width: 16px; height: 16px; accent-color: var(--accent); }
.legend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.legend-list li { display: flex; align-items: center; gap: 8px; }
.legend-list.cols { grid-template-columns: 1fr 1fr; gap: 3px 8px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; background: var(--c); flex: none; }
.line-sample { width: 36px; height: 0; border-top: 4px solid var(--link-line); flex: none; }
.line-sample.dash { border-top: 2px dashed var(--link-line); }
.legend-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; }

/* 右下の注記 */
.a1-note {
  position: absolute; right: 16px; bottom: 16px; width: 270px; z-index: 4;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line);
  border-left: 6px solid var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; line-height: 1.6;
  box-shadow: var(--shadow);
}
.a1-note strong { display: block; font-size: 13px; margin-bottom: 2px; }
.a1-note p { margin: 0; }
.a1-note .a1-new { margin-top: 4px; color: var(--ink-3); }

/* ===== 右側パネル（スマホでは下からのシート） ===== */
.panel {
  position: fixed; right: 0; top: var(--topbar-actual, var(--topbar-h)); bottom: 0; width: min(460px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(102%); transition: transform var(--ease), visibility var(--ease); visibility: hidden;
  z-index: 40; display: flex; flex-direction: column;
}
.panel.open { transform: none; visibility: visible; }
.panel-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 0 16px; }
.panel-grip { display: none; }
.panel-close {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface-2);
  cursor: pointer; font-size: 20px; line-height: 1;
}
.panel-body { flex: 1; overflow: auto; padding: 4px 18px 28px; }
.crumb { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.crumb b { color: var(--ink-2); }
.panel-title { margin: 6px 0 8px; font-size: 21px; line-height: 1.4; display: flex; gap: 10px; align-items: flex-start; }
.panel-title .swatch { width: 18px; height: 18px; margin-top: 6px; border-radius: 4px; }
.panel h3 { font-size: 14px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line); letter-spacing: .04em; }
.panel p { margin: 6px 0; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--accent); }
.link-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.link-list button {
  width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); cursor: pointer; line-height: 1.5;
}
.link-list button:hover { border-color: var(--line-2); }
.link-list .lk-to { font-weight: 700; }
.link-list .lk-label { display: block; font-size: 12.5px; color: var(--ink-3); }
.kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }
.kind.core { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ピル・バッジ */
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; line-height: 1.7; white-space: nowrap; }
.pill.high { background: var(--pill-high-bg); color: var(--pill-high-ink); }
.pill.mid { background: var(--pill-mid-bg); color: var(--pill-mid-ink); }
.pill.low { background: var(--pill-low-bg); color: var(--pill-low-ink); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; line-height: 1.6; vertical-align: 1px; white-space: nowrap; }
.badge.sup { background: var(--badge-sup-bg); color: var(--badge-sup-ink); }
.badge.new { background: var(--badge-new-bg); color: var(--badge-new-ink); }
.badge.weight { background: var(--badge-weight-bg); color: var(--badge-weight-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

e,"new":false,"aka":[],"note":null},{"id":"basics-cia-5","name":"責任追跡性","desc":"誰がいつ何をしたかを後からたどれる性質。ログの記録で確保する。","sup":false,"new":false,"aka":[],"note":null},{"id":"basics-cia-6","name":"否認防止","desc":"行った操作や送った事実を、後から「やっていない」と言えなくする性質。デジタル署名などで実現する。","sup":false,"new":false,"aka":[],"note":null},{"id":"basics-cia-7","name":"信頼性","desc":"システムが意図したとおりに、一貫して動く性質。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"basics-risk","name":"脅威・脆弱性・リスク","terms":[{"id":"basics-risk-1","name":"情報資産","desc":"守る対象となる情報・機器・サービス・人の知識など、組織にとって価値のあるもの。","sup":false,"new":false,"aka":[],"note":null},{"id":"basics-risk-2","name":"脅威","desc":"情報資産に損害を与えるおそれのある原因。攻撃者、災害、操作ミスなど。","sup":false,"new":false,"aka":[],"note":null},{"id":"basics-risk-3","name":"脆弱性","desc":"脅威につけ込まれる弱点。設定ミス、プログラムの欠陥、教育不足など。","sup":false,"new":false,"aka":[],"note":null},{"id":"basics-risk-4","name":"攻撃対象領域（アタックサーフェス）","desc":"外部から攻撃できる入口の総量。公開サーバや開いているポートが増えるほど広がる。","sup":false,"new":false,"aka":["攻撃対象領域","アタックサーフェス"],"note":null}]},{"id":"basics-principle","name":"設計原則","terms":[{"id":"basics-principle-1","name":"多層防御","desc":"性質の異なる対策を何重にも重ね、一つが破られても次で止める考え方。","sup":false,"new":false,"aka":[],"note":null},{"id":"basics-principle-2","name":"最小権限の原則","desc":"利用者やプログラムに、仕事に必要な最小限の権限だけを与える考え方。","sup":false,"new":false,"aka":["最小権限"],"note":null},{"id":"basics-principle-3","name":"need-to-knowの原則","desc":"業務上知る必要がある人だけに情報を見せる原則。","sup":false,"new":false,"aka":["need-to-know"],"note":null},{"id":"basics-principle-4","name":"セキュリティ・バイ・デザイン","desc":"企画・設計の段階からセキュリティを組み込む考え方。後から足すより安く確実。","sup":false,"new":false,"aka":["セキュリティバイデザイン"],"note":null},{"id":"basics-principle-5","name":"セキュア・バイ・デフォルト","desc":"初期設定のままで安全な状態になるように製品を作る考え方。","sup":false,"new":true,"aka":[],"note":null},{"id":"basics-principle-6","name":"フェイルセーフ／フェイルセキュア","desc":"故障時に被害が出ない側（止める）へ倒すのがフェイルセーフ、守りを固める側（閉じる）へ倒すのがフェイルセキュア。","sup":false,"new":false,"aka":["フェイルセーフ","フェイルセキュア","フェールセーフ"],"note":null}]},{"id":"basics-zt","name":"ゼロトラストと境界防御","term ,"note":null},{"id":"threats-authattack-3","name":"クレデンシャルスタッフィング","desc":"別のサイトから漏れたIDとパスワードの組を使い回してログインを試す攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-authattack-4","name":"MFA疲労攻撃","desc":"多要素認証の承認通知を大量に送りつけ、利用者が根負けして承認するのを狙う攻撃。","sup":false,"new":true,"aka":[],"note":null},{"id":"threats-authattack-5","name":"レインボーテーブル攻撃","desc":"ハッシュ値と元のパスワードの対応表を使い、ハッシュ値から素早くパスワードを割り出す攻撃。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"threats-dos","name":"DoS・ネットワーク攻撃","terms":[{"id":"threats-dos-1","name":"DDoS攻撃","desc":"多数の機器から大量の通信を送りつけ、サービスを止める攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-dos-2","name":"リフレクション攻撃（DNSアンプ攻撃）","desc":"送信元を標的に偽った小さな問合せで、第三者のサーバから大きな応答を標的に送らせる攻撃。","sup":false,"new":false,"aka":["リフレクション攻撃","DNSアンプ"],"note":null},{"id":"threats-dos-3","name":"ポートスキャン","desc":"どのポートが開いているかを調べ、攻撃の入口を探す偵察行為。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-dos-4","name":"DNSキャッシュポイズニング","desc":"キャッシュDNSサーバに偽の応答を覚えさせ、利用者を偽サイトへ誘導する攻撃。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"threats-social","name":"人をだます攻撃","terms":[{"id":"threats-social-1","name":"ソーシャルエンジニアリング","desc":"技術ではなく人の心理のすきを突いて、パスワードなどを聞き出す手口。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-social-2","name":"標的型攻撃メール","desc":"特定の組織あてに、業務を装ったメールで添付ファイルやリンクを開かせる攻撃。","sup":false,"new":false,"aka":["標的型攻撃"],"note":null},{"id":"threats-social-3","name":"ビジネスメール詐欺（BEC）","desc":"取引先や経営者になりすましたメールで、偽の口座へ送金させる詐欺。","sup":false,"new":false,"aka":["ビジネスメール詐欺","BEC"],"note":null},{"id":"threats-social-4","name":"フィッシング","desc":"本物そっくりの偽サイトに誘導し、IDやカード番号を入力させる手口。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"threats-advanced","name":"AIと高度な攻撃","terms":[{"id":"threats-advanced-1","name":"プロンプトインジェクション","desc":"生成AIへの入力や参照データに命令文を紛れ込ませ、開発者の意図しない動作をさせる攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-advanced-2","name":"データポイズニング","desc":"AIの学習データに不正なデータを混ぜ、判断をゆがめる攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-advanced-3","name":"ディープフェイク","desc":"AIで作った偽の映像や音声。経営者になりすました送金指示などに悪用される。","sup":false,"new":false,"aka":[],"note":null},{"id":"threats-advanced-4","name":"ソフトウェアサプライチェーン攻撃","desc":"正規ソフトの更新配信や部品（ライブラリ）を汚染し、利用者全体に被害を広げる攻撃。","sup":false,"new":true,"aka":[],"note":null}]}]},{"id":"crypto","order":3,"domain":"cryptoauth","color":"#653C93","name":"暗号技術","short":"暗号技術","priority":"high","badges":[],"summary":"情報を「読めなくする」「改ざんを見破る」「本人が作ったと証明する」ための道具箱。認証・安全な通信・電子署名など、多くの技術の部品になる。","themes":["共通鍵暗号と公開鍵暗号の使い分け（ハイブリッド暗号）","ハッシュ・MAC・デジタル署名の違い","証明書の検証とPKI（証明書チェーン、失効確認）","鍵管理（HSM、鍵の暗号化、鍵のライフサイクル）","前方秘匿性と耐量子計算機暗号"],"keywords":["AES","RSA暗号","楕円曲線暗号","SHA-256","HMAC","デジタル署名","PKI","OCSP","HSM","前方秘匿性"],"examA2":"暗号方式の特徴、ハッシュ関数の性質、証明書の失効確認などの知識を問う。","examB":"R7秋 問2で暗号鍵の管理と署名の生成・検証、R5秋 問2でサーバ証明書の検証と秘密鍵の管理、R7春 問3でプライベートCAのルート証明書が題材になった。","official":[{"doc":"試験要綱 Ver.5.6","where":"科目A-2 中分類11 セキュリティ（◎4）"},{"doc":"シラバス Ver.2.1","where":"科目B 3-1 暗号利用及び鍵管理"},{"doc":"シラバス案 Ver.0.1（新制度）","where":"中分類25「7 暗号技術」"}],"priorityReason":"試験要綱の科目A-2重点分野（セキュリティ◎4）。直近の科目Bでは、R7秋 問2（暗号資産交換業の暗号鍵管理）、R5秋 問2（サーバ証明書の検証・秘密鍵の管理）、R7春 問3（プライベートCAのルート証明書）、R5秋 問3（HSM）が暗号を題材にしている。新制度のシラバス案でも小分類「暗号技術」として独立し、耐量子計算機暗号（PQC）や暗号アジリティが用語例に加わった。","textbook":["7.1","7.4","7.7"],"subs":[{"id":"crypto-symmetric","name":"共通鍵暗号","terms":[{"id":"crypto-symmetric-1","name":"AES","desc":"現在の標準的な共通鍵のブロック暗号。鍵の長さは128・192・256ビット。","sup":false,"new":false,"aka":[],"note":null},{"id":"crypto-symmetric-2","name":"ブロック暗号／ストリーム暗号","desc":"決まった長さのかたまりごとに暗号化する方式と、ビットやバイトの単位で連続して暗号化する方式。","sup":false,"new":false,"aka":["ブロック暗号","ストリーム暗号"],"note":null},{"id":"crypto-symmetric-3","name":"暗号利用モード","desc":"ブロック暗号で長いデータを暗号化するときのつなぎ方（CBC、CTR、GCMなど）。","sup":false,"new":false,"aka":[],"note":null},{"id":"crypto-symmetric-4","name":"認証付き暗号（AEAD）","desc":"暗号化と改ざんの検知を同時に行う方式。AES-GCMが代表例。","sup":false,"new":false,"aka":["AEAD","認証付き暗号"],"note":null}]},{"id":"crypto-pubkey","name":"公開鍵暗号と鍵交換","terms":[{"id":"crypto-pubkey-1"," たがる。直近の科目Bでは、R6秋 問2（DMARC・SPF・DKIM）、R6春 問2（IPSとDDoS対策）、R7秋 問3（VPNサービス）、R5秋 問2（ファイアウォールの設定・無線LAN）、R6春 問1（WAFの利点と課題）が防御技術を題材にしている。新制度のシラバス案では、ZTNAやDoH／DoTなどが用語例に明記された。","textbook":["5.5","5.6","5.7","5.8","7.2","7.3","7.4","7.5"],"subs":[{"id":"netdef-perimeter","name":"境界防御","terms":[{"id":"netdef-perimeter-1","name":"ファイアウォール","desc":"送信元・宛先・ポートなどのルールで、通してよい通信だけを通す装置。","sup":false,"new":false,"aka":[],"note":null},{"id":"netdef-perimeter-2","name":"ステートフルインスペクション","desc":"通信のやり取りの状態を覚えておき、正しい応答のパケットだけを通す方式。","sup":false,"new":false,"aka":["ステートフルパケットフィルタ"],"note":null},{"id":"netdef-perimeter-3","name":"DMZ","desc":"外部に公開するサーバを置くための、内部ネットワークとは分けた区画。","sup":false,"new":false,"aka":[],"note":null},{"id":"netdef-perimeter-4","name":"UTM","desc":"ファイアウォール・IPS・マルウェア対策などを1台にまとめた装置。","sup":false,"new":false,"aka":["統合脅威管理"],"note":null}]},{"id":"netdef-detect","name":"検知・防御装置","terms":[{"id":"netdef-detect-1","name":"IDS","desc":"不正な通信を見つけて知らせる仕組み。通信を止めはしない。","sup":false,"new":false,"aka":[],"note":null},{"id":"netdef-detect-2","name":"IPS","desc":"不正な通信を見つけて遮断する仕組み。誤検知すると正常な通信まで止めてしまう。","sup":false,"new":false,"aka":[],"note":null},{"id":"netdef-detect-3","name":"シグネチャ型／アノマリ型","desc":"既知の攻撃パターンと照合する方式と、ふだんと違う振る舞いを異常とみなす方式。","sup":false,"new":false,"aka":["シグネチャ型","アノマリ型"],"note":null},{"id":"netdef-detect-4","name":"WAF","desc":"HTTPの中身を見て、Webアプリへの攻撃（SQLインジェクションなど）を止める装置。","sup":false,"new":false,"aka":[],"note":null},{"id":"netdef-detect-5","name":"偽陽性／偽陰性","desc":"正常なものを攻撃と判断してしまうこと（フォールスポジティブ）と、攻撃を見逃すこと（フォールスネガティブ）。","sup":false,"new":false,"aka":["偽陽性","フォールスポジティブ"],"note":null}]},{"id":"netdef-vpn","name":"VPNとリモートアクセス","terms":[{"id":"netdef-vpn-1","name":"IPsec","desc":"IPの層で通信を暗号化・認証するプロトコル群（ESP、AH、IKE）。","sup":false,"new":false,"aka":[],"note":null},{"id":"netdef-vpn-2","name":"TLS-VPN","desc":"TLSを使うVPN。ブラウザや専用ソフトで社内に接続する。SSL-VPNとも呼ぶ。","sup":true,"new":false,"aka":["SSL-VPN","TLS-VPN"],"note":null},{"id":"netdef-vpn-3","name":"ZTNA","desc":"利用者と端末を毎回確かめ、許可したアプリに },{"id":"osdb","order":7,"domain":"infra","color":"#235F80","name":"OS・サーバ・データベース・端末のセキュリティ","short":"OS・DB・端末","shortLines":["OS・DB・","端末"],"priority":"mid","badges":[],"summary":"Webアプリやサービスを動かす「土台」の守り方。OSやサーバの設定を固め、データベースを守り、社員のPCやスマホを管理する。","themes":["要塞化（不要なサービスの停止、最小権限）","Linuxのファイル権限と管理者権限","データベースのアクセス制御と暗号化","EDR・MDMによる端末の管理","TPM・セキュアブートなどハードウェアによる守り"],"keywords":["要塞化","パーミッション","セキュアOS","パッチ管理","データベース暗号化","ストアドプロシージャ","MDM","EDR","TPM","セキュアブート"],"examA2":"データベース（○3）の正規化・トランザクションや、OSのアクセス制御、TPMなどを問う。","examB":"R6春 問4でLinuxの権限設定、R6秋 問1でエンドポイントのログとマルウェア対策が題材になった。","official":[{"doc":"試験要綱 Ver.5.6","where":"科目A-2 中分類9 データベース（○3）"},{"doc":"シラバス追補版 Ver.4.0","where":"中分類11「5. セキュリティ実装技術」の(3)OSのセキュリティ・(5)データベースセキュリティ"},{"doc":"シラバス案 Ver.0.1（新制度）","where":"中分類17 データベース、中分類26「ハードウェアのセキュリティ」"}],"priorityReason":"試験要綱では科目A-2のデータベースは○3で、重点分野ではない。直近の科目Bでは、R6春 問4（Linuxの権限設定）とR6秋 問1（エンドポイントのログ）が題材にしているが、どちらもWebアプリやインシデント対応の問の一部として出ている。新制度でもデータベースは科目A-2の○（重点ではない）のまま。","textbook":["4.5","5.2","5.4","5.9"],"subs":[{"id":"osdb-harden","name":"OSとサーバの要塞化","terms":[{"id":"osdb-harden-1","name":"要塞化（ハードニング）","desc":"不要なサービスやアカウントを止め、設定を固めて攻撃の入口を減らすこと。","sup":false,"new":false,"aka":["要塞化","ハードニング"],"note":null},{"id":"osdb-harden-2","name":"パーミッション","desc":"ファイルごとに、所有者・グループ・その他の人が読める・書ける・実行できるかを決める設定。","sup":true,"new":false,"aka":[],"note":null},{"id":"osdb-harden-3","name":"rootとsudo","desc":"何でもできる管理者アカウントと、必要なときだけ一時的に管理者として命令を実行する仕組み。","sup":true,"new":false,"aka":[],"note":null},{"id":"osdb-harden-4","name":"セキュアOS","desc":"強制アクセス制御などで、管理者でも勝手な操作をできないようにしたOS。Trusted OSとも呼ぶ。","sup":false,"new":false,"aka":["セキュアOS","Trusted OS"],"note":null},{"id":"osdb-harden-5","name":"パッチ管理","desc":"OSやソフトの修正プログラムを、計画的に確認・適用すること。","sup":false,"new":true,"aka":[],"note":null}]},{"id":"osdb-db","name":"データベースの安全","terms":[{"id":"osdb-db-1","name":"データベース暗号化","desc":"保存したデータを暗号化し、媒体の盗難やファイルの持出しから守る対策。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-db-2","name":"GRANT／REVOKE","desc":"表ごとに、誰が参照・更新できるかの権限を与えたり取り消したりするSQLの命令。","sup":false,"new":false,"aka":["GRANT"],"note":null},{"id":"osdb-db-3","name":"ビュー","desc":"表の一部だけを見せる仮想的な表。見せたくない列を隠すのに使える。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-db-4","name":"排他制御","desc":"複数の処理が同時に同じデータを更新しても、矛盾が起きないようにする仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-db-5","name":"ストアドプロシージャ","desc":"データベースの中に保存しておく一連の処理。アプリ側でSQLを組み立てずに済む。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"osdb-endpoint","name":"端末・モバイル管理","terms":[{"id":"osdb-endpoint-1","name":"MDM","desc":"会社が配るスマホやタブレットを一元管理し、紛失時には遠隔でロックやデータ消去を行う仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-endpoint-2","name":"リモートワイプ","desc":"紛失した端末のデータを、遠隔操作で消去すること。","sup":false,"new":false,"aka":["遠隔でのデータ消去"],"note":null},{"id":"osdb-endpoint-3","name":"BYOD","desc":"私物の端末を業務に使うこと。会社の管理が届きにくく、情報漏えいのおそれがある。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-endpoint-4","name":"シャドーIT","desc":"会社が把握・許可していないクラウドサービスや機器を、従業員が業務で使うこと。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"osdb-antimal","name":"マルウェア対策製品","terms":[{"id":"osdb-antimal-1","name":"マルウェア対策ソフト","desc":"既知のマルウェアの特徴をまとめた定義ファイルと照合して、検知・駆除するソフト。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-antimal-2","name":"ビヘイビア法（振る舞い検知）","desc":"プログラムの動きを観察し、怪しい挙動から未知のマルウェアを見つける方式。","sup":false,"new":false,"aka":["ビヘイビア法","振る舞い検知"],"note":null},{"id":"osdb-antimal-3","name":"EDR","desc":"端末の操作や通信を記録・監視し、侵入された後の検知・調査・隔離を助ける製品。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-antimal-4","name":"サンドボックス","desc":"隔離された環境で怪しいファイルを実際に動かし、挙動を観察する仕組み。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"osdb-hw","name":"ハードウェアの安全","terms":[{"id":"osdb-hw-1","name":"TPM","desc":"PCに内蔵され、鍵の保管や、起動時の状態の測定を行うセキュリティチップ。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-hw-2","name":"セキュアブート","desc":"起動するときに、署名を確かめた正規のプログラムだけを読み込む仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-hw-3","name":"耐タンパ性","desc":"装置をこじ開けたり解析したりしても、中の秘密情報を取り出しにくい性質。","sup":false,"new":false,"aka":[],"note":null},{"id":"osdb-hw-4","name":"自己暗号化ドライブ（SED）","desc":"書き込むデータを自動で暗号化する記憶装置。","sup":false,"new":false,"aka":["自己暗号化ドライブ"],"note":null}]}]},{"id":"cloud","order":8,"domain":"infra","color":"#1A6872","name":"クラウド・コンテナ・AI・IoT／制御システム","short":"クラウド・AI・IoT","shortLines":["クラウド・","AI・IoT"],"priority":"high","badges":["new-weight"],"summary":"クラウドやコンテナ、生成AI、IoT機器や工場の制御システムなど、新しい基盤ならではの守り方。「だれがどこまで守るか」という分担を押さえるのが鍵になる。","themes":["責任共有モデルとIaaS・PaaS・SaaSの違い","クラウドの設定ミスとアクセスキーの漏えい","コンテナとCI/CDパイプラインの安全","CASB・CSPM・SASEの役割","生成AIの安全な利用（プロンプトインジェクション対策、RAGのアクセス制御）","制御システムの安全（IEC 62443、ITとOTの分離）"],"keywords":["責任共有モデル","IaaS","SaaS","CASB","CSPM","SASE","コンテナ","IaC","プロンプトインジェクション対策","IEC 62443"],"examA2":"責任共有モデル、CASBやSASEの役割、IoT・制御システムの規格などを問う。","examB":"R5秋 問3でCIサービスとコンテナ、R6春 問3でクラウド上のWebサイト、R7春 問3でクラウドストレージのアクセスキー、R7秋 問4でSCADA（制御システム）が題材になった。","official":[{"doc":"シラバス追補版 Ver.4.0","where":"中分類11「5. セキュリティ実装技術」の(8)IoTシステムの設計・開発におけるセキュリティ"},{"doc":"シラバス Ver.2.1","where":"科目B 2-3（仮想化、コンテナ技術に関する知識）"},{"doc":"シラバス案 Ver.0.1（新制度）","where":"中分類26「クラウド・コンテナのセキュリティ」「IoT・制御システムのセキュリティ」「AIシステムを守るための対策」"}],"priorityReason":"直近の科目Bでは、R5秋 問3（CIサービスとコンテナ）、R6春 問3（クラウド上のWebサイト）、R7春 問3（クラウドストレージのアクセスキー）、R7秋 問4（SCADA）がこの分野の基盤を題材にしている。新制度では、科目B大項目2の製品・サービスの導入に「IoT、クラウドサービスを含む」と明記され、諸規程に「AIの安全な導入・利用」が加わり、シラバス案に「AIシステムを守るための対策（Security for AI）」の項目ができた。","textbook":["1.5","1.8"],"subs":[{"id":"cloud-shared","name":"クラウドと責任共有","terms":[{"id":"cloud-shared-1","name":"責任共有モデル","desc":"クラウド事業者と利用者が、どこまでを守るかを分担する考え方。IaaS・PaaS・SaaSで境目が変わる。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-shared-2","name":"IaaS／PaaS／SaaS","desc":"事業者が提供する範囲で分けたクラウドの種類。IaaSは基盤だけ、SaaSはアプリまで提供する。","sup":false,"new":false,"aka":["IaaS","SaaS","PaaS"],"note":null},{"id":"cloud-shared-3","name":"クラウドの設定不備","desc":"ストレージの公開設定や過大な権限など、利用者側の設定ミス。情報漏えいの原因になる。","sup":false,"new":true,"aka":[],"note":null},{"id":"cloud-shared-4","name":"アクセスキー","desc":"プログラムからクラウドを操作するための認証情報。漏れると誰でもその権限で操作できてしまう。","sup":true,"new":false,"aka":[],"note":null},{"id":"cloud-shared-5","name":"署名付きURL","desc":"期限と権限を付けて、一時的にファイルへアクセスさせるURL。秘密の鍵を使うのでサーバ側で作る。","sup":true,"new":false,"aka":[],"note":null}]},{"id":"cloud-container","name":"仮想化・コンテナ","terms":[{"id":"cloud-container-1","name":"仮想化","desc":"1台の物理サーバの上で、複数の仮想マシンを動かす技術。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-container-2","name":"コンテナ","desc":"アプリと必要な部品をまとめ、OSのカーネルを共有して軽く動かす技術。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-container-3","name":"コンテナイメージの脆弱性管理","desc":"コンテナの元になるイメージに含まれる部品の脆弱性を、スキャンして管理すること。","sup":false,"new":true,"aka":[],"note":null},{"id":"cloud-container-4","name":"IaC","desc":"サーバやネットワークの構成をコードで書き、自動で構築する手法。設定ミスをスキャンで見つけられる。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-container-5","name":"CI/CDパイプライン","desc":"コードの変更を自動でビルド・テスト・配備する仕組み。乗っ取られると不正なコードが配られる。","sup":false,"new":true,"aka":["CI/CD"],"note":null}]},{"id":"cloud-protect","name":"SASE・クラウド保護","terms":[{"id":"cloud-protect-1","name":"CASB","desc":"従業員のクラウド利用を見える化し、許可しないサービスの利用やデータの持出しを制御する仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-protect-2","name":"CSPM","desc":"クラウドの設定を継続的に点検し、危険な設定ミスを見つける仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-protect-3","name":"CWPP","desc":"クラウド上の仮想マシンやコンテナなど、動いている処理そのものを守る仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-protect-4","name":"SASE","desc":"ネットワーク機能とセキュリティ機能をまとめて、クラウドから提供する考え方。","sup":false,"new":false,"aka":[],"note":null},{"id":"cloud-protect-5","name":"インスタンスメタデータサービスの保護","desc":"仮想マシンから認証情報を取り出せる仕組みを、SSRFなどで悪用されないように守ること。","sup":false,"new":true,"aka":[],"note":null}]},{"id":"cloud-ai","name":"AIのセキュリティ","terms":[{"id":"cloud-ai-1","name":"プロンプトインジェクション対策","desc":"指示と外部データを分ける、AIエージェントの権限を絞るなどして、不正な命令の実行を防ぐ対策。","sup":false,"new":true,"aka":[],"note":null},{"id":"cloud-ai-2","name":"RAGのアクセス制御","desc":"生成AIが参照する社内データに、利用者の権限に応じた参照制限をかける priorityReason":"試験要綱の科目A-2重点分野（セキュリティ◎4）に含まれ、科目Bでは小項目2-5（セキュアプログラミング）に当たる。直近の科目Bでは、R5秋 問1、R6春 問1・問3・問4、R6秋 問3・問4、R7春 問3、R7秋 問1がWebアプリや実装を主な題材にしている。新制度のサンプル問2もWebサイトのセッションフィクセーションを題材にしている。","textbook":["2.5","2.8","3.6","8.2","8.3","8.4"],"subs":[{"id":"web-vuln","name":"Webの主な脆弱性","terms":[{"id":"web-vuln-1","name":"クロスサイトスクリプティング（XSS）","desc":"利用者の入力をそのままページに出力したため、悪意あるスクリプトが閲覧者のブラウザで動いてしまう脆弱性。","sup":false,"new":false,"aka":["クロスサイトスクリプティング"],"note":"ch03/xss-vs-csrf.md"},{"id":"web-vuln-2","name":"反射型／格納型／DOM型XSS","desc":"スクリプトがリクエストからそのまま返る型、サーバに保存されて表示される型、ブラウザ側のJavaScriptだけで起きる型。","sup":false,"new":false,"aka":["反射型","格納型"],"note":null},{"id":"web-vuln-3","name":"SQLインジェクション","desc":"入力にSQLの断片を混ぜて、データベースを不正に操作する攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-vuln-4","name":"クロスサイトリクエストフォージェリ（CSRF）","desc":"ログイン中の利用者に、罠のページから本人の意図しないリクエストを送らせる攻撃。","sup":false,"new":false,"aka":["クロスサイトリクエストフォージェリ","CSRF"],"note":"ch03/xss-vs-csrf.md"},{"id":"web-vuln-5","name":"OSコマンドインジェクション","desc":"入力を通じて、サーバ上でOSのコマンドを実行させる攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-vuln-6","name":"ディレクトリトラバーサル","desc":"「../」などでファイルの場所をさかのぼり、公開していないファイルを読む攻撃。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"web-session","name":"セッション管理","terms":[{"id":"web-session-1","name":"セッションハイジャック","desc":"他人のセッションIDを盗んで、その人になりすます攻撃。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-session-2","name":"セッションフィクセーション","desc":"攻撃者が用意したセッションIDを利用者に使わせ、ログイン後に乗っ取る攻撃。ログイン時にIDを新しく発行して防ぐ。","sup":false,"new":true,"aka":["セッション固定化","セッションフィクセーション"],"note":null},{"id":"web-session-3","name":"CSRFトークン","desc":"フォームに推測できない値を埋め込み、正規の画面からの送信かを確かめる対策。","sup":false,"new":true,"aka":[],"note":null},{"id":"web-session-4","name":"オープンリダイレクト","desc":"任意のURLへ転送できる機能を悪用し、正規のサイトを経由して偽サイトへ誘導する手口。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"web-browser","name":"ブラウザの防御機構","terms":[{"id":"web-browser-1","name":"同一オリジンポリシー","desc":"スキーム・ホスト・ポートの組が違うオリジンのデータを、スクリプトから勝手に読めないようにするブラウザの制限。","sup":false,"new":false,"aka":["Same Origin Policy"],"note":null},{"id":"web-browser-2","name":"CORS","desc":"同一オリジンポリシーの例外として、サーバが許可したほかのオリジンからのアクセスを認める仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-browser-3","name":"Cookieの属性","desc":"Secure（HTTPSでだけ送る）、HttpOnly（スクリプトから読ませない）、SameSite（ほかのサイトからの送信を制限）。","sup":false,"new":true,"aka":["HttpOnly","SameSite"],"note":null},{"id":"web-browser-4","name":"CSP","desc":"読み込んでよいスクリプトなどの出どころを、サーバからブラウザに指示する仕組み。XSSの被害を減らす。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-browser-5","name":"HSTS","desc":"以後はHTTPSでだけ接続するよう、ブラウザに覚えさせる仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-browser-6","name":"SRI","desc":"外部から読み込むスクリプトのハッシュ値を指定し、改ざんされていたら実行させない仕組み。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"web-api","name":"API・スマホアプリ","terms":[{"id":"web-api-1","name":"OWASP Top 10","desc":"Webアプリの重大なリスクをまとめた代表的な一覧。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-api-2","name":"OWASP API Security Top 10","desc":"APIに特有の主なリスク（認可の不備など）をまとめた一覧。","sup":false,"new":true,"aka":[],"note":null},{"id":"web-api-3","name":"認可の不備","desc":"IDを書き換えるだけで他人のデータを取得できるなど、権限の確認が漏れている脆弱性。","sup":false,"new":false,"aka":["認可・権限・アクセス制御の不備"],"note":null},{"id":"web-api-4","name":"パスワードのハードコード","desc":"秘密情報をプログラムに直接書き込むこと。アプリを解析されれば取り出されてしまう。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"web-code","name":"言語別の安全な実装","terms":[{"id":"web-code-1","name":"エスケープ処理","desc":"出力先で特別な意味を持つ文字を、ただの文字として表示されるよう変換すること。XSS対策の基本。","sup":false,"new":true,"aka":[],"note":null},{"id":"web-code-2","name":"プレースホルダ","desc":"SQL文の形を先に固定し、値を後から当てはめる方式。SQLインジェクション対策の基本。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-code-3","name":"バッファオーバーフロー","desc":"確保した領域を超えて書き込み、プログラムを異常終了させたり乗っ取ったりする脆弱性。C/C++で特に注意する。","sup":false,"new":false,"aka":[],"note":null},{"id":"web-code-4","name":"ソルトとストレッチング","desc":"パスワードのハッシュに利用者ごとの乱数を加え、計算を何度も繰り返して解読を遅らせる対策。","sup":false,"new":false,"aka":["ソルト","ストレッチン 護」が加わった。試験要綱のサービスマネジメントは科目A-2で○3（重点ではない）。","textbook":["5.10","5.11"],"subs":[{"id":"ops-log","name":"ログ管理と時刻同期","terms":[{"id":"ops-log-1","name":"ログの取得と保管","desc":"何を、どの機器で、どれだけの期間記録するかを決め、安全に保存すること。","sup":false,"new":false,"aka":["ログの取得","ログの保管"],"note":null},{"id":"ops-log-2","name":"ログの改ざん防止","desc":"ログを追記しかできない領域や別のサーバに保存し、攻撃者に消されないようにすること。","sup":false,"new":true,"aka":["改ざん防止"],"note":null},{"id":"ops-log-3","name":"時刻同期","desc":"機器の時計をNTPなどでそろえ、複数のログを時系列で正しく突き合わせられるようにすること。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-log-4","name":"相関分析","desc":"複数の機器のログを組み合わせ、単独では見えない攻撃の兆候を見つける分析。","sup":false,"new":false,"aka":["ログの相関分析"],"note":null}]},{"id":"ops-detect","name":"検知基盤","terms":[{"id":"ops-detect-1","name":"SIEM","desc":"さまざまな機器のログを集めて相関分析し、攻撃の兆候を知らせる仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-detect-2","name":"XDR","desc":"端末・ネットワーク・クラウドなどの検知情報をまとめて分析する仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-detect-3","name":"NDR","desc":"ネットワークの通信を分析し、侵入された後の不審な動きを見つける仕組み。","sup":false,"new":true,"aka":[],"note":null},{"id":"ops-detect-4","name":"SOAR","desc":"決まった対応の手順を自動化し、多くの警報を効率よく処理する仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-detect-5","name":"UEBA","desc":"利用者や機器のふだんの行動を学習し、そこから外れた動きを見つける仕組み。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"ops-soc","name":"SOCと運用サービス","terms":[{"id":"ops-soc-1","name":"SOC","desc":"組織のネットワークや機器を監視し、攻撃を検知・分析する専門のチーム。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-soc-2","name":"アラートトリアージ","desc":"大量の警報を、重要度や本物らしさで仕分けし、対応の順番を決めること。","sup":false,"new":true,"aka":[],"note":null},{"id":"ops-soc-3","name":"MSS／MDR","desc":"監視や、検知・対応を外部の専門事業者に任せるサービス。","sup":false,"new":false,"aka":["MSS","MDR"],"note":null},{"id":"ops-soc-4","name":"脅威ハンティング","desc":"警報を待たずに、侵入の痕跡が潜んでいないかを自分から探す活動。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"ops-ti","name":"脅威インテリジェンス","terms":[{"id":"ops-ti-1","name":"脅威インテリジェンス","desc":"攻撃者や手口に関する情報を集めて分析し、防御に役立てる知見。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-ti-2","name":"IoC","desc":"侵害の痕跡を示す情報。不正な通信先のIPアドレスや、マルウェアのハッシュ値など。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-ti-3","name":"STIX／TAXII","desc":"脅威情報を構造化して書く形式（STIX）と、それを自動で交換する手順（TAXII）。","sup":false,"new":false,"aka":["STIX","TAXII"],"note":null},{"id":"ops-ti-4","name":"TLP","desc":"共有した情報をどこまで広めてよいかを、色で示すルール。","sup":false,"new":false,"aka":["TLP","Traffic Light Protocol"],"note":null},{"id":"ops-ti-5","name":"OSINT","desc":"公開されている情報源から集める情報や、その手法。","sup":false,"new":false,"aka":[],"note":null}]},{"id":"ops-data","name":"データ保護・DLP","terms":[{"id":"ops-data-1","name":"DLP","desc":"機密データの送信やコピーを監視し、外部への持出しを防ぐ仕組み。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-data-2","name":"データマスキング","desc":"データの一部を伏せ字などに置き換え、必要以上に見せないようにすること。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-data-3","name":"情報の削除","desc":"記憶媒体を廃棄・再利用する前に、復元できない方法でデータを消すこと。","sup":false,"new":false,"aka":["情報の削除"],"note":null},{"id":"ops-data-4","name":"Web分離","desc":"Webの閲覧を隔離した環境で行い、端末にマルウェアが届かないようにする仕組み。","sup":false,"new":false,"aka":["Web 分離","Web アイソレーション"],"note":null}]},{"id":"ops-svc","name":"サービスマネジメント","terms":[{"id":"ops-svc-1","name":"SLA","desc":"サービスの提供者と利用者が、品質の目標（稼働率など）を取り決めた合意。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-svc-2","name":"変更管理","desc":"システムの変更を記録・評価・承認してから行い、障害や不正な変更を防ぐ管理。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-svc-3","name":"サービスデスク","desc":"利用者からの問合せや障害の報告を一元的に受け付ける窓口。","sup":false,"new":false,"aka":[],"note":null},{"id":"ops-svc-4","name":"可用性管理","desc":"合意した稼働率を守るために、冗長化や保守の計画を管理すること。","sup":false,"new":false,"aka":[],"note":null}]}]},{"id":"incident","order":13,"domain":"resp","color":"#A8441A","name":"インシデント対応・フォレンジック・事業継続","short":"インシデント対応","shortLines":["インシデント","対応"],"priority":"high","badges":[],"summary":"事故が起きたときに「被害を止め、原因を突き止め、元に戻し、再発を防ぐ」ための体制と手順。証拠の扱い方と、事業を止めないための備えも含む。","themes":["CSIRTの構築と役割","対応の流れ（準備・検知と分析・封じ込め・根絶・復旧・事
